# E1 纯量效应(L2:量跌价稳,须下钻到门店层才命中)
#
# 数据锚点(AttributionEngine 实测,非估计值):
#   北京全市 gmv   800,834.32 → 776,230.18   -3.07%
#   STORE_S0002    189,604.18 →  98,171.23   -48.22%
#     订单数            334 →         180    -46.11%
#     客单价(AOV)   567.68 →      545.40    -3.93%   ← 与量的降幅差一个数量级
#     销量              850 →         473    -44.35%
#   贡献度:contribute('gmv','store','store_id','2025-06-01','2025-06-30',
#                     '2025-07-01','2025-07-31') 里该店 change=-91,432.95,
#           全量总变化 -207,246.16 → 贡献 0.4412(全量前 3 名内)
#   口径说明:北京全市的口径**不可辩护** —— 城市总变化只有 -24,604.14(其余门店同期
#   增长抵消了大半),该店变化量除以城市变化量 = 3.72,即「贡献度 > 1」,已不是占比。
#   故区间按 contribute 的全量口径取,与 c2「多个可辩护口径取并集」的做法一致
#   (不能辩护的口径不并入区间)。
#   干扰项:6→7 月自然季节回落(SEASON 6 月 0.95 → 7 月 0.90),全量同期 -207,246.16
id: e1_pure_volume
tier: L2
category: 零售
question: "为什么 2025 年 7 月北京的 GMV 环比 6 月下滑了?"
expected:
  root_cause_slice:
    dimension: store
    level: store_id
    key: STORE_S0002
    label: 北京国贸旗舰店
  mechanism: "北京国贸旗舰店订单数 -46.11%(334 → 180)、销量 -44.35%,而客单价只降 3.93%(567.68 → 545.40,噪声量级)—— GMV 的 -48.22% 几乎全部来自「量」,「价」没动,是纯量效应"
  contribution_range: [0.30, 0.60]
  required_depth: store_id
  must_not_claim: ["季节性回落是唯一原因", "全部门店同步下滑"]
distractors: ["6 月大促后全量自然回落", "北京其余门店同期小幅增长掩盖了单店下滑"]
slice_occupancy:              # §5.10 约束 1:本 case 的影响集合
  dimension: store
  keys: [STORE_S0002]
  window: [2025-07-01, 2025-07-31]
overlap_with: []              # 与其它 case 的影响集合不相交(切片键不同 / 窗口不重叠)
note: "埋点方式:窗口内对该店整单隔一留一(订单数 ×0.5),每行金额一字不动 —— 量与价在数据层被人为解耦,考的正是「先分量价再下结论」。落点选在 2025-07(而非 2026-06)以避开被测试钉死的 2026-06 全量 -20.95% 与 STORE_S0001。"
