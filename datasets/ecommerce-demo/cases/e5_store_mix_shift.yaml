# E5 门店权重结构变化(L2:城市总量跳变全部来自一家基准期不存在的门店)
#
# 数据锚点(AttributionEngine 实测,非估计值):
#   合肥全市 gmv   427,118.35 →  537,713.95   +25.89%
#     订单数            773 →        1,004   +29.88%
#   其中 STORE_S0451(合肥政务区中心店)基准期**不存在**:
#     引擎实测 base=None → cmp=99,619.92(订单 190 单),占对比期全市 18.53%
#   存量 10 家门店合计 427,118.35 → 438,094.03  +2.57%(自然水平,无异常)
#   贡献度:新店增量 99,619.92 / 城市增量 110,595.60 = 0.9008
#   口径说明:全量口径不可辩护 —— 全国同期(2025-03→04)总变化为负(季节性),
#     正增量除以负的总变化会得到 -0.20 这种符号无意义的数;本 case 只有一个可辩护
#     口径(问题所问的合肥口径),故区间按它取。
#   干扰项:3→4 月季节系数 0.95 → 0.98,存量门店本身也确实小幅回升(+2.57%),
#     容易把城市 +25.89% 误读成「经营增长」
id: e5_store_mix_shift
tier: L2
category: 零售
question: "为什么 2025 年 4 月合肥的 GMV 环比 3 月大涨 25.9%?"
expected:
  root_cause_slice:
    dimension: store
    level: store_id
    key: STORE_S0451
    label: 合肥政务区中心店
  mechanism: "合肥 2025-04 新增一家门店(基准期完全不存在,引擎 base=None),它贡献 99,619.92,占城市增量 110,595.60 的 90.08%;存量 10 家门店合计只 +2.57% —— 城市 +25.89% 是门店权重的结构变化(新店跳变),不是存量增长"
  contribution_range: [0.75, 1.05]
  required_depth: store_id
  must_not_claim: ["存量门店高速增长驱动", "全部门店同步增长"]
distractors: ["4 月季节性回升", "存量门店也在增长"]
slice_occupancy:              # §5.10 约束 1:本 case 的影响集合
  dimension: store
  keys: [STORE_S0451]
  window: [2025-04-01, 2025-04-30]
overlap_with: []              # 与其它 case 的影响集合不相交(切片键不同 / 窗口不重叠)
note: "埋点方式:把合肥存量门店窗口内每 100 个整单中的 22 个复制到 1 家新门店(发新单号、改挂新店),存量门店的行一字未动 —— 增量 100% 由「凭空出现的切片」解释。只开 1 家(而非 2-3 家)是为了让 root_cause_slice 保持单键可判(评分是 key 的严格相等)。城市选合肥是实测挑的:2025-03→04 存量门店自然环比 +2.6%(各城市中最接近 0),能保证「结构变化」是唯一解释。"
