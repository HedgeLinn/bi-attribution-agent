# E4 量价反向(L2:量增价减、GMV 持平,总量指标看不见的劣化)
#
# 数据锚点(AttributionEngine 实测,非估计值):
#   成都全市 gmv   508,014.10 → 575,289.58   +13.24%
#     订单数            946 →      1,246     +31.71%
#     客单价(AOV)   537.01 →      461.71     -14.02%   ← 城市客单价被单店拖下来
#   STORE_S0004    195,780.68 → 197,291.75   +0.77%     ← 该店 GMV 几乎持平
#     订单数            357 →         545     +52.66%
#     客单价(AOV)   548.41 →      362.00     -33.99%   ← 量的增幅与价的降幅互相抵消
#     销量              949 →       1,480     +55.95%
#   数值维为何不声明区间:该店 GMV 环比 +0.77%,对城市 GMV 变化的贡献度只有 0.0225
#     (全量口径 0.0023),「贡献度」在本 case 上没有区分度 —— 考的是量价结构而不是
#     总量贡献,故 contribution_range: null(评分跳过数值维,与 c3/c4 同类处理)。
#   干扰项:2025-08 是季节回升月(SEASON 7 月 0.90 → 8 月 0.93),成都全市 +13.24%
#     里有相当一部分是季节性的,容易让人得出「增长健康」的结论
id: e4_volume_price_reversal
tier: L2
category: 零售
question: "2025 年 8 月成都的 GMV 环比增长 13%,但客单价下降了 14%——这个增长的质量如何?"
expected:
  root_cause_slice:
    dimension: store
    level: store_id
    key: STORE_S0004
    label: 成都春熙路旗舰店
  mechanism: "成都春熙路旗舰店订单数 +52.66%(357 → 545)、销量 +55.95%,而客单价 -33.99%(548.41 → 362.00)—— 量与价反向变动、乘积使该店 GMV 几乎持平(+0.77%),却把全市客单价拉低 14.02%:是靠走量撑住的同规模盘子,增长质量劣化"
  contribution_range: null      # GMV 持平 → 贡献度无区分度,不评数值维
  required_depth: store_id
  must_not_claim: ["客单价下滑是全市场普遍现象", "GMV 增长说明经营健康"]
distractors: ["8 月季节性回升", "成都全市 GMV +13.24% 看起来是健康增长"]
slice_occupancy:              # §5.10 约束 1:本 case 的影响集合
  dimension: store
  keys: [STORE_S0004]
  window: [2025-08-01, 2025-08-31]
overlap_with: []              # 与其它 case 的影响集合不相交(切片键不同 / 窗口不重叠)
note: "埋点方式:窗口内复制该店每 5 个整单中的 2 个(发新单号,订单数 ×1.4),再把整窗每行金额 ×1/1.4 —— GMV 近似不变、订单数 ×1.4、客单价 ×0.714。落点 2025-08(与 E6 同窗、不同城),避开被钉死的 2026-06 与 2026-02(2 月天数口径差是 c3 的考点,不混进来)。"
