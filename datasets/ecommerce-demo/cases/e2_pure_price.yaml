# E2 纯价效应(L2:价跌量稳,总量被掩盖,须下钻才命中)
#
# 数据锚点(AttributionEngine 实测,非估计值):
#   广州全市 gmv 1,017,927.52 → 1,036,565.37   +1.83%   ← 城市总量是**涨**的
#   STORE_S0003    200,255.68 →  150,712.24   -24.74%
#     订单数            369 →         368     -0.27%    ← 客流一动不动
#     客单价(AOV)   542.70 →      409.54     -24.54%   ← 降幅全在这里
#     销量              966 →         945     -2.17%
#   贡献度:contribute('gmv','store','store_id', 2025-06, 2025-07) 里该店
#     change=-49,543.44,全量总变化 -207,246.16 → 贡献 0.2391(全量前 3 名内)
#   口径说明:广州口径不可辩护 —— 城市总变化是 +18,637.85(其余门店增长),
#     该店变化量除以城市变化量 = -2.66(负值),不是占比,故不并入区间。
#   干扰项:广州其余门店同期整体增长,把该店 -24.74% 的下滑在总量层完全掩盖
id: e2_pure_price
tier: L2
category: 零售
question: "2025 年 7 月广州的 GMV 环比 6 月微增 1.8%,总量看起来正常。请核查是否存在被总量掩盖的门店级问题。"
expected:
  root_cause_slice:
    dimension: store
    level: store_id
    key: STORE_S0003
    label: 广州天河旗舰店
  mechanism: "广州天河旗舰店客单价 -24.54%(542.70 → 409.54),而订单数 -0.27%(369 → 368)、销量 -2.17% 基本不动 —— GMV 的 -24.74% 完全来自「价」,是纯价效应(全店整体折价),客流没有问题"
  contribution_range: [0.13, 0.36]
  required_depth: store_id
  must_not_claim: ["订单量下滑是主因", "全市普遍降价"]
distractors: ["广州其余门店同期增长,掩盖了单店下滑"]
slice_occupancy:              # §5.10 约束 1:本 case 的影响集合
  dimension: store
  keys: [STORE_S0003]
  window: [2025-07-01, 2025-07-31]
overlap_with: []              # 与其它 case 的影响集合不相交(切片键不同 / 窗口不重叠)
note: "埋点方式:窗口内该店每行金额(含 discount/refund)×0.7,订单数与行数一字不动 —— 与 E1 恰成一对(同为 2025-07,一个只动量、一个只动价)。考察点是「量价解耦」与「总量正常不等于没有异常」。"
