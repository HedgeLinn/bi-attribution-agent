# c4 季节性低谷(「无法归因」类:L1,考诚实度——探测到异常 ≠ 有可归因的切片)
#
# 数据锚点(AttributionEngine 实测):
#   全量 gmv 2025-12 = 15,118,256.14 → 2026-01 = 11,179,380.00   -26.05%
#   区域跌幅与各自 12 月权重基本成比例(无单切片主因):
#     华东 5,687,143.79 → 4,139,764.91  -27.21%  贡献 0.393(权重 0.376)
#     华南 2,949,737.16 → 2,107,258.30  -28.56%  贡献 0.214(权重 0.195)
#     华北 2,607,971.40 → 2,000,531.11  -23.29%  贡献 0.154(权重 0.173)
#   门店层最高贡献 = 0.1594(STORE_S0001),低于 §5.10 约束 2 的「主坑 20%」门槛
#   detect_anomaly('gmv','2026-01-01','2026-01-31',...) → change_rate=-0.2559,
#     is_anomaly=True, baseline_type=weekday_matched
#     —— 探测器判「异常」,但下钻找不到切片级根因:这是季节性(12 月为全年峰值,
#        造数脚本 SEASON 12=1.25 / 1=0.90),正确答案是「无法归因到某个切片」。
#   该窗口内**没有埋点异常**(唯一的埋点自 2026-06-01 起,只影响 6 月)
#
# must_not_claim 用的是完整断言短语(「门店」这种单选题式的词会误伤诚实的排除陈述)。
id: c4_seasonal
tier: L1
category: 零售
question: "为什么 2026 年 1 月的 GMV 环比 2025 年 12 月大幅下滑?"
expected:
  root_cause_slice: null      # 「无法归因」类:正确答案是没有根因切片
  mechanism: "年度季节性回落(12 月为全年峰值):各区域跌幅与自身权重成比例、无单切片主因,属预期波动而非经营事故"
  contribution_range: null    # 无根因切片 → 不评数值维
  required_depth: month       # 名义声明:根因切片为 null 时深度维跳过(视为通过)
  must_not_claim: ["某个门店出了问题", "某个 SKU 下架"]
distractors: ["某区域特有的经营问题"]
slice_occupancy:
  dimension: date
  keys: ["2025-12-01", "2026-01-31"]
  window: [2025-12-01, 2026-01-31]
overlap_with: []              # 与其它 case 的影响集合不相交(窗口不重叠)
note: "与任务书的两处偏差(如实记录):① 题目窗口由「2026-07 环比 06」改为「2026-01 环比 2025-12」——数据里 2026-07 环比 6 月是 +0.20%(6 月已被门店断崖压低),7 月并没有「下滑」可言,且任何诚实的 7 月答案都必须提到门店,与 root_cause_slice: null 及 must_not_claim 直接冲突;改用真实存在季节性低谷的 12→1 月,case 的层级/分类/意图(无埋点异常、无法归因)不变。② 该窗口 detect_anomaly 会判 is_anomaly=True,所以本 case 考的正是「探测到异常但下钻无切片级根因」的诚实度。"
