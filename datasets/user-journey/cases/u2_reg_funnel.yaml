# U2 注册漏斗的分子塌了(漏斗环节定位:L2)
#
# 数据锚点(AttributionEngine 实测,非估计值):
#   **CH_ADS(信息流广告)逐月**:
#     2026-01 访问 4347 注册 193 转化率 4.4398%
#     2026-02 访问 4027 注册 210 转化率 5.2148%   ← 基期
#     2026-03 访问 4067 注册  87 转化率 2.1392%   ← 对比期:-58.98%
#     2026-04 访问 3554 注册 212 转化率 5.9651%   ← 自行恢复
#   分母(访问量)几乎没动:4027 → 4067(+0.99%);分子(注册数)塌了一半:210 → 87(-58.57%)。
#   **比率分解(engine.decompose('reg_rate', [registrations, visits], 2 月, 3 月, filters=CH_ADS))**:
#     分子效应 -0.03041516(贡献度 0.9889)   分母效应 -0.00034115(贡献度 0.0111)
#     —— 98.89% 的转化率下滑来自注册这一步,访问量只解释 1.11%
#   **渠道层对照(contribute reg_rate 2 → 3 月)**:只有 CH_ADS 塌,其余渠道没塌
#     CH_ADS      5.2148% → 2.1392%  -58.98%
#     CH_SOCIAL   4.8988% → 4.5864%  -6.38%    CH_APPSTORE 4.7320% → 4.5478% -3.89%
#     CH_ORGANIC  4.3313% → 5.3939% +24.53%    CH_OFFLINE   2.9679% → 4.1929% +41.28%
#   **全站注册数的陷阱**:2026-02 与 2026-03 的全站注册数**都是 800**(造数把月拉新钉死在 800),
#     所以全站 registrations 的两窗总变化 = 0 —— 用 contribute('registrations', 'channel', ...) 下钻时
#     **每个切片的贡献度都是 null**(引擎在总变化为 0 时不给贡献度),只有「访问量没动、注册数
#     塌了」这条分子/分母的对照能把根因钉在 CH_ADS 上。
#
# 正确答案:CH_ADS 的注册转化率下滑出在**漏斗的注册环节**(分子),不是流量质量(分母)、
#   也不是全站普遍现象 —— 该渠道的访问量持平而注册数腰斩,且 4 月自行恢复到 5.97%。
# 数值维不评:比率/派生指标的 contribution 恒为 null(引擎按 change_rate 排序);而全站 registrations
#   两窗总变化为 0,contribute 的贡献度也恒为 null —— 声明区间会误伤诚实答案。
id: u2_reg_funnel
tier: L2
category: 漏斗
question: "信息流广告渠道 3 月的注册转化率从 5.21% 掉到 2.14%,是不是这个渠道的流量质量变差了?"
expected:
  root_cause_slice:
    dimension: channel
    level: channel_id
    key: CH_ADS
    label: 信息流广告
  mechanism: "转化率下滑出在注册环节(分子)而不是流量(分母):CH_ADS 的访问量 4027 → 4067
    基本持平(+0.99%),注册数却从 210 掉到 87(-58.57%),比率分解里分子效应占 98.89%、
    分母效应只占 1.11%;同期其他渠道的转化率没有同向塌陷(两个渠道反而上升),且 CH_ADS 的
    转化率在 4 月自行回到 5.97% —— 是注册这一步在 3 月被掐住,不是渠道流量质量变差。"
  contribution_range: null      # 比率指标 + 全站分子两窗变化为 0,贡献度恒为 null,见文件头
  required_depth: channel_id
  must_not_claim: ["信息流广告渠道的访问量下滑导致注册转化率下降", "各渠道注册转化率同步走低,是全站大盘现象",
                   "注册数下降属于正常波动,不需要处理"]
distractors: ["全站注册数两个月都是 800(月拉新被钉死),单看总量完全看不出某渠道塌了一半",
             "CH_ORGANIC(+24.53%)与 CH_OFFLINE(+41.28%)的转化率同期在上升,「全站转化率下滑」不成立",
             "CH_ADS 的转化率 4 月自行恢复到 5.97% —— 是单月的环节故障,不是渠道质量变了"]
slice_occupancy:
  dimension: channel
  keys: [CH_ADS]
  window: [2026-02-01, 2026-03-31]
overlap_with: []
note: "引擎行为:reg_rate 声明为 ratio + computation: two_stage(先各自聚合再相除),所以它**不能**
  按行求平均,也不能跨切片相加;contribute('reg_rate', …) 的 contribution 恒为 null,只能按
  change_rate 排序定根因。漏斗环节的判据是 decompose 的分子/分母效应 —— 这是 agent 手上没有的
  工具,得靠「访问量 vs 注册数」两条原始指标的对照自己算出来。"
