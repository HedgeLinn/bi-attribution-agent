# U5 DAU 跨期口径(半可加陷阱,「无法归因」类:L3)
#
# 数据锚点(AttributionEngine 实测,非估计值):
#   **引擎对 dau(半可加,time_aggregation: last)的返回**:
#     query_metric('dau', [], {}, '2026-06-01', '2026-06-14') → total = **544**(只一行)
#     query_metric('dau', ['day'], {}, '2026-06-01', '2026-06-14') → **仍然只有一行**
#       [{'day': '2026-06-14', 'value': 544}],total = None
#     —— 任意窗口取窗口内**最后有数据日**的值,不是逐日求和、也不是窗口均值;
#        加了 day 维度也一样只回最后一天的行(半可加是全局口径,不随分组变化)
#   **逐日 DAU(必须把窗口缩到单日才查得到)**:
#     6/01~6/07: 500 563 703 521 533 524 532  → 求和 3876,均值 553.71
#     6/08~6/14: 538 559 516 539 523 541 544  → 求和 3760,均值 537.14
#   三条口径对「6 月第二周 vs 第一周」给出**三个方向/量级**:
#     ① 窗口末值(引擎的 dau 口径):532 → 544 = **+2.26%**  ← 看起来在回暖
#     ② 逐日求和(人日,错读):        3876 → 3760 = -2.99%,是单日水平的 7.1 倍 / 去重人数的 1.8 倍
#     ③ 去重活跃用户(active_users): 2166 → 2090 = **-3.51%**  ← 正确口径
#   ① 之所以反向:544 是 **6-14 单日**的值、532 是 **6-07 单日**的值,两个单日快照本来
#     就不可比 —— 6-14 那天恰好比第二周的日均(537.14)高、而 6-07 比第一周的日均(553.71)低,
#     两端偏差方向相反,把整段的「微降」读成了「上升」。
#   对照:5/18~5/31 的 dau 末值 571、去重 3184 —— 无论哪条口径,6 月上半月都没有回暖。
#
# 正确答案:不是回暖(也不是「用户盘在流失」的塌方),是**口径问题** —— 半可加指标不能
#   跨时间求和,窗口末值也不能当整段水平用;按去重活跃用户看,两周是 -3.51% 的缓慢收缩。
#   没有业务根因切片,正确结论是「无法归因到任何切片」+ 说清口径。
# 数值维不评:无根因切片(null-root),见 marketing-funnel 的 c4/c5 同类写法。
id: u5_dau_caliber
tier: L3
category: 跨粒度
question: "6 月第二周的 DAU 是 544,比第一周的 532 高了 2.3%,日活是不是见底回暖了?"
expected:
  root_cause_slice: null        # 「无法归因」类:正确答案是口径错误,没有业务根因切片
  mechanism: "不是回暖,是半可加指标的跨期读法错了。引擎的 dau 对任意窗口取**最后有数据日**
    的值:544 是 6-14 单日的 DAU、532 是 6-07 单日的 DAU,两个单日快照不可比(6-14 高于
    第二周日均 537.14、6-07 低于第一周日均 553.71,两端偏差方向相反,把微降读成了上升)。
    按去重活跃用户看,两周是 2166 → 2090(-3.51%),对照 5 月下半月的 3184 也没有回暖;
    把逐日 DAU 相加得到的 3876 / 3760 是「人日」—— 比单日水平(约 540 ~ 550)大 7 倍、
    比同窗口的去重人数(2166 / 2090)大 1.8 倍,量级和含义都不对,同样不能用。"
  contribution_range: null      # 无根因切片 → 不评数值维
  required_depth: day           # 名义声明:根因切片为 null 时深度维跳过(视为通过)
  must_not_claim: ["6 月第二周的日活比第一周回升了,说明用户盘见底回暖", "把两周的 DAU 逐日相加即可得到该时段的活跃用户数",
                   "6 月前两周的活跃用户数是 3876 人"]
distractors: ["窗口末值口径给出 +2.26%(方向都是反的,这正是陷阱本身)",
             "逐日求和口径给出 -2.99%(方向对,但 3876 / 3760 是「人日」:单日水平的 7 倍、去重人数的 1.8 倍)",
             "6/03 单日 DAU 冲到 703(比前一日 563 高 25%、比后一日 521 高 35%),拿单日脉冲当趋势同样是口径错误"]
slice_occupancy:
  dimension: date
  keys: ["2026-06-01", "2026-06-14"]
  window: [2026-06-01, 2026-06-14]
overlap_with: [u1_batch_cliff, u4_arpu_structural]
note: "例外声明(§5.10 约束 1):本 case 的观察对象是**口径**(引擎的半可加语义),不是某个
  业务切片,属全局量;窗口与 u1(4~5 月)在 05-18~05-31 重叠、与 u4(5~6 月)整段重叠,
  显式声明为「允许叠加」。评测时定位维按「无法归因 = true」判定(见 eval_report.score_case),
  给出的同时不得再报任何根因 —— 半可加指标的取值语义在语义层 caveats 第 2 条里写明。"
