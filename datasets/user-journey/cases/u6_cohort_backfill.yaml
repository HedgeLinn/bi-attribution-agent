# U6 线下渠道批次回填,同期群归属错误(数据质量,「无法归因」类:L2)
#
# 数据锚点(AttributionEngine 实测 + 用户级核对,非估计值):
#   **同期群看板的读数(active_users,按 signup_month)**:
#     2026-01 窗口,CH_OFFLINE:2026-01 同期群 104 人、**2026-02 同期群 150 人**
#       —— 「2026-02 注册」的人在 1 月就活跃了,自相矛盾
#     2026-02 窗口,CH_OFFLINE:2026-01 同期群  98 人、 2026-02 同期群 **229 人**
#       —— 2 月同期群看起来比 1 月「翻倍还多」,像拉新大成功
#   **用户级取证(直接读 parquet 现算)**:
#     记录注册日 > 首次事件日的用户 = **恰好 150 人,全部是 CH_OFFLINE**;
#     首次事件日散在 2026-01-05 ~ 2026-01-18,记录注册日全部是 **2026-02-05**;
#     这 150 人在 1 月窗口留下 **1664 行**事件,其 ingest_day **全部是 2026-02-05**
#       —— 即事件发生在 1 月,入库日是 2-05(批次一次性补采),ingest_day ≠ 事件日;
#     dim_user 里 ingest_day = 2026-02-05 的用户共 180 人(150 回填 + 30 当天真实注册);
#     按 signup_date 看:signup_date='2026-02-05' 的用户在 1 月窗口有 150 人活跃、
#       在 2 月窗口有 174 人活跃 —— 1 月那 150 人就是这批回填用户。
#   对照组:除这 150 人外,其余用户的记录注册日都**不晚于**首次事件日(库存用户更早,
#     因为数据窗口从 2025-06-01 开始)。
#
# 正确答案:不是 2 月拉新成功,是**线下渠道的批次回填**把 150 个 1 月就活跃的用户记成了
#   2026-02-05 注册 —— 同期群的「人数」随回填批次漂移,是数据质量现象而非业务变化。
#   判断真实归属要回落到事件本身的日期(day),记录注册日(signup_date)在这批人身上不可信。
# 数值维不评:无根因切片(null-root)。
id: u6_cohort_backfill
tier: L2
category: 数据质量
question: "线下地推 2026-02 的同期群有 229 人,比 2026-01 的 104 人多了一倍还多,是不是 2 月的地推拉新特别成功?"
expected:
  root_cause_slice: null        # 「无法归因」类:正确答案是回填导致同期群归属错误,没有业务根因切片
  mechanism: "线下渠道存在**批次回填**:150 个用户在 2026-01-05~01-18 就已经有事件
    (1664 行,ingest_day 全部是 2026-02-05),但他们的 signup_date 被批次上传日改写成
    2026-02-05 —— 于是 1 月窗口里「2026-02 同期群」凭空出现 150 人(记录注册日之前就活跃),
    2 月窗口里 2026-02 同期群被这 150 人抬高到 229 人。同期群人数随回填批次漂移,是数据
    质量现象;判断真实归属必须回落到事件日,不能读这批人的 signup_date。"
  contribution_range: null      # 无根因切片 → 不评数值维
  required_depth: signup_date   # 名义声明:根因切片为 null 时深度维跳过(视为通过)
  must_not_claim: ["2026-02 线下地推的拉新效果显著,同期群人数创新高", "这 150 人是 2026-02-05 新注册的用户",
                   "同期群人数的月度变化反映真实的用户质量变化"]
distractors: ["2026-02 窗口里 2026-02 同期群 229 人 vs 2026-01 同期群 98 人 —— 同期群口径下的「拉新翻倍」",
             "1 月窗口里出现 2026-02 同期群 150 人(记录注册日在观测窗口之后),本身就是自相矛盾",
             "同期群人数在 1 月窗口与 2 月窗口对不上(150 vs 229),漂移的是记录注册日不是用户"]
slice_occupancy:
  dimension: cohort
  keys: ["2026-02-05"]
  window: [2026-01-01, 2026-02-28]
overlap_with: [u2_reg_funnel]
note: "例外声明(§5.10 约束 1):本 case 的观察对象是同期群归属本身(记录注册日被回填改写),
  是全局量;窗口 2026-01~02 与 u2(2026-02~03)在 2 月重叠,显式声明为「允许叠加」。
  与 marketing-funnel 的 c4(埋点整段缺失)同类:都是数据完整性现象,「没有行 / 行不可信」
  不等于 0,正确处理是标注而不是补数。"
