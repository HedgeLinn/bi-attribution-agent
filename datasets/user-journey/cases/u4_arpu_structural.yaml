# U4 ARPU 上升实为低价值用户流失的结构效应(反向辛普森,本套数据的灵魂:L4)
#
# 数据锚点(AttributionEngine 实测,非估计值):
#   **整体 arpu** 2026-05 1745.0276 分 → 2026-06 1819.6816 分(**+74.6540 分,+4.278%**)
#   **结构分解(engine.decompose('arpu', [user_mix, user_value], 5 月, 6 月))**:
#     结构效应(**mix**)+113.2951 分   贡献度 +151.76%
#     自身效应(__rate__) -38.6410 分   贡献度  -51.76%
#     两者之和 = 74.6540 = total_change(残差 ~4e-13,恒等式成立)
#     —— 「人均上升」里,结构效应比整体升幅还大,自身效应是**负的**
#   **成因(tier 维度)**:
#     active_users  低价值 1149 → 854(-295,-25.67%,贡献度 0.9547)
#                   中价值 2081 → 2070(-11)   高价值 1231 → 1228(-3)
#     低价值用户占比 25.76% → 20.57%(-5.19pp),他们的 ARPU 只有整体的一成不到
#     **三个分层各自的 ARPU 没有一个上升**:高价值 4445.31 → 4302.07(-3.22%)
#                                          中价值 1035.10 → 1047.60(+1.21%)
#                                          低价值  137.81 →  121.60(-11.76%)
#   **分子其实在缩**:revenue 7,784,568 → 7,555,318 分(**-2.95%**);
#     active_users 4461 → 4152(-6.93%)—— 分母掉得比分子快,比值才上升。
#   独立核对(反事实,不用引擎的分解):用 5 月权重 × 6 月各层人均 = 1707.1556,
#     与 6 月实际 1819.6816 相差 +112.5260 分 ≈ 引擎的结构效应 113.2951。
#
# 正确答案:人均收入上升**不是**用户变值钱了,而是低价值用户大量流失把平均值抬了上去;
#   同时总收入是下滑的。这是「看起来是好消息」的反向辛普森 —— 只说「用户质量提升」即错。
# 数值维不评(重要):arpu 是派生指标,contribute('arpu', …) 的 contribution 恒为 null;
#   而「结构效应占 151.76%」这个数只有 decompose 能算,agent 手上没有 decompose 工具
#   (工作台也不展示 decompositions)—— 声明区间会误伤诚实答案。本 case 靠
#   定位命中 + 深度达标 + 无错误断言三维评分。
id: u4_arpu_structural
tier: L4
category: 跨粒度
question: "6 月的人均收入(ARPU)比 5 月涨了 4.3%,是不是用户质量在提升?"
expected:
  root_cause_slice:
    dimension: tier
    level: tier_id
    key: 低价值
    label: 低价值
  mechanism: "整体人均上升 74.65 分(+4.278%)里,结构效应 +113.30 分(151.76%)、自身效应
    -38.64 分(-51.76%)—— 是**低价值用户流失**把平均值抬高的:低价值活跃用户 1149 → 854
    (-295,-25.67%),占比从 25.76% 掉到 20.57%,而他们的人均只有 137.81 分(不到整体的
    1/10);三个分层**各自的**人均都没跑赢整体(高 -3.22% / 中 +1.21% / 低 -11.76%,
    最大涨幅 +1.21% 远小于整体的 +4.28%),且总收入同期下滑 2.95%(778.46 万 → 755.53 万分)。
    人均上升 = 分母(低价值用户)掉得比分子(收入)更快,不是用户变值钱了。"
  contribution_range: null      # 见文件头:派生指标的 contribution 恒为 null,结构分解工具不在 agent 手上
  required_depth: tier_id
  must_not_claim: ["整体人均收入上升说明用户质量提升、用户结构变好", "各分层用户的人均收入都在上升,带动整体 ARPU 上涨",
                   "6 月的收入比 5 月更高,人均和总量都在增长"]
distractors: ["整体 ARPU 确实涨了 4.278%(数字本身没错,错在把它读成「变好」)",
             "高价值用户的人均也在跌(-3.22%)—— 「高价值用户越来越值钱」不成立",
             "tier 维度上低价值活跃用户的贡献度是 0.9547,但那是**用户数**的贡献度,不是 ARPU 的"]
slice_occupancy:
  dimension: tier
  keys: [低价值]
  window: [2026-05-01, 2026-06-30]
overlap_with: []
note: "引擎行为:tier 是派生维度(tier_id 在事实表上),语义层为 arpu 声明了 structural 分解
  (entity_dimension: tier,factors: [user_mix, user_value]),「结构效应 / 自身效应」正是
  decompose 的输出。但 agent 的四个工具里没有 decompose,render_overview 也不展示分解声明 ——
  它必须靠**分层下钻**(低价值用户数塌了 + 各层人均都没涨 + 总收入在跌)自己推出结构效应。
  这条「工具能力 ↔ case 考点」的缝是本 case 最大的评分风险,见交付报告。"
