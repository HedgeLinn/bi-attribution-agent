# U1 社交批次断崖(切片 > 同期群:L3)
#
# 数据锚点(AttributionEngine 实测,非估计值):
#   **渠道层 4 → 5 月 active_users**:渠道层的读数只是「略差于大盘」,看不出塌方
#     CH_SOCIAL   849 → 771  -9.19%(贡献度 0.6500 —— 全站 -120 人里它占 78)
#     CH_APPSTORE 1334 → 1305 -2.17%   CH_OFFLINE 652 → 638  -2.15%
#     CH_ADS 1016 → 1014  -0.20%       CH_ORGANIC 730 → 733  +0.41%
#   **批次层同一窗口 active_users**:同月拉来的用户,社交批次比最差的同龄批次还陡 2.18 倍
#     CH_SOCIAL-2026-01    121 → 31   -74.38%(贡献度 0.7500 —— 全站 -120 人里它占 90)
#     CH_APPSTORE-2026-01  167 → 110  -34.13%   CH_ADS-2026-01      153 → 101  -33.99%
#     CH_OFFLINE-2026-01    75 →  53  -29.33%   CH_ORGANIC-2026-01   84 →  69  -17.86%
#   **同期群留存曲线(按月 active_users)**:渠道层看不见、只有同期群能看见的那条线
#     CH_SOCIAL-2026-01    151 → 148 → 138 → 121 → **31** → 19   (5 月断崖)
#     CH_APPSTORE-2026-01  233 → 229 → 211 → 167 → 110 → 81      (平滑衰减)
#     CH_ADS-2026-01       193 → 183 → 185 → 153 → 101 → 72      (平滑衰减)
#     CH_SOCIAL 渠道整体    821 → 808 → 841 → 849 → 771 → 757     (5 月只少 9%)
#   断崖后该批次**没有归零**:6 月仍 19 人活跃、6/1~6/7 一周还有 8 人 ——
#   是活跃度塌了(留存曲线掉了台阶),不是这批人走光了。
#
# 正确答案:问题出在 CH_SOCIAL-2026-01 这一个**渠道 × 注册月**的组合上,不是社交渠道整体
#   拉新质量,也不是大盘自然回落。渠道层之所以「看着还行」,是被同渠道更早的批次平均掉了。
# 干扰项:
#   ① CH_SOCIAL-2025-12 同窗口 -61.04%(77 → 30)—— 基期只有 77 人,是留存模型在小同期群
#      上的自然波动,贡献度仅 0.3917;它只影响「相对变化率」的排序,不影响「绝对变化量」
#      的排序(它 |变化| = 47,只有 CH_SOCIAL-2026-01 的 90 的 52%)。自称根因即错。
#   ② 全站 4 → 5 月 active_users -2.62%:大盘确实在缓慢回落,这是背景不是根因。
id: u1_batch_cliff
tier: L3
category: 切片下钻
question: "社交裂变渠道 5 月的活跃用户比 4 月少了 78 人,是社交渠道拉来的用户质量整体变差了,还是某一批用户出了问题?"
expected:
  root_cause_slice:
    dimension: batch
    level: batch_id
    key: CH_SOCIAL-2026-01
    label: CH_SOCIAL-2026-01
  mechanism: "塌方集中在「社交裂变 × 2026 年 1 月」这一个批次上:该批次活跃用户 121 → 31(-74.38%),
    同期群留存曲线 151→148→138→121→**31**→19 在 2026-05 掉了一个台阶,而同月拉来的其他渠道批次
    只降 17.86%~34.13%、社交渠道整体只降 9.19%(被更早的批次摊平)。渠道层的总量口径看不见这条
    曲线 —— 必须先按**渠道 × 注册月**拆成批次、再看各批次的逐月留存,才能把 90 人(全站降幅的
    75%)落到这一个批次上。"
  contribution_range: [0.55, 0.95]      # 实测 0.7500(该批次变化 / 全站总变化);比率指标无此口径
  required_depth: batch_id
  must_not_claim: ["社交裂变渠道整体拉新质量下滑导致活跃下降", "各渠道的活跃用户同步回落,属于大盘自然衰减",
                   "这是全站用户自然流失造成的普遍现象,没有特定批次异常"]
distractors: ["CH_SOCIAL-2025-12 同窗口也跌了 61.04%(基期仅 77 人,贡献度只有 0.3917,是小同期群的波动)",
             "渠道层 CH_SOCIAL 只降 9.19%,看起来只是「略差于大盘」",
             "全站 4 → 5 月 active_users 本身在缓慢回落(-2.62%)"]
slice_occupancy:
  dimension: batch
  keys: [CH_SOCIAL-2026-01]
  window: [2026-04-01, 2026-05-31]
overlap_with: []
note: "引擎行为:batch 是**派生维度**(channel_id × 注册月 的组合),层级 [channel_id, batch_id] ——
  停在 channel_id 层只能看到被摊平后的 9.19%,必须下钻到 batch_id。同一份「渠道层正常 / 批次层
  塌方」的对照,也可以用 cohort 维度按 signup_month 看(2026-01 那个月同样会露出台阶),但只有
  batch_id 能把「社交 × 1 月」这一个组合单独指出来。"
