# U3 版本留存断崖(技术问题伪装成业务问题:L2)
#
# 数据锚点(AttributionEngine 实测,非估计值):
#   **按版本 contribute active_users(2026-03-08~04-07 → 2026-04-08~05-08)**:
#     全窗 4710 → 4522(-188)
#     V4.2.0   241 →  66  -72.61%  贡献度 0.9309   ← 占全站降幅的 93%
#     V4.2.1  1834 → 1811 -1.25%   贡献度 0.1223
#     V4.0.8  1223 → 1203 -1.64%   贡献度 0.1064
#     V4.1.3  1412 → 1442 +2.12%   贡献度 -0.1596
#   —— 只有 V4.2.0 断崖,另外三个版本纹丝不动甚至微涨:不是大盘、不是运营节奏。
#   **它在全站里很小,所以全站口径看不见**:V4.2.0 只占基期的 5.12%(241/4710),
#     全站两窗只降 3.99%;detect_anomaly('active_users', 04-08~05-08) 给出
#     is_anomaly=False(变化率 -8.06%,未过 15% 阈值)—— 异常检测在全站层面**报不出**这个坑。
#   **断崖的位置(逐日)**:V4.2.0 的日活 04-01~04-07 稳定在 30~40 人,**04-08 当天掉到 2 人**,
#     之后 04-09 起一直是 1~4 人;但逐月看 6 月仍有 61 人活跃 —— 是「留存曲线掉了台阶」
#     (该版本用户还在,活跃度掉到残余水平),不是「版本被下线」。
#
# 正确答案:2026-04-08 起 V4.2.0 这一个版本的用户留存断崖 —— 版本级的技术问题(客户端问题),
#   不是运营活动结束、不是大盘回落、更不是用户自然流失。必须下钻到 app_version 才看得见。
# 干扰项:
#   ① 全站 active_users 只降 3.99%、异常检测判定「非异常」—— 大盘口径会让人放过去;
#   ② 其余三个版本的降幅都在 ±2% 内,「各版本同步走低」不成立。
id: u3_version_cliff
tier: L2
category: 切片下钻
question: "4 月 8 日前后 App 的活跃用户少了一截,是运营活动结束后的正常回落,还是哪里出了问题?"
expected:
  root_cause_slice:
    dimension: version
    level: app_version
    key: V4.2.0
    label: V4.2.0
  mechanism: "断崖只发生在 V4.2.0 这一个版本:该版本活跃用户 241 → 66(-72.61%),贡献了全站
    188 人降幅中的 175 人(93.09%);另外三个版本同期分别是 -1.25% / -1.64% / +2.12%,全站
    只降 3.99% 且异常检测判定「非异常」—— 因为该版本只占全站 5.12%,在总量口径里被稀释掉了。
    版本级的留存断崖属技术问题(客户端),不是运营节奏也不是大盘回落。逐日看断崖就落在
    2026-04-08:该版本日活 04-07 还是 31 人,04-08 掉到 2 人,之后再没回来。"
  contribution_range: [0.65, 1.05]      # 实测 0.9309(版本层 contribute 的贡献度)
  required_depth: app_version
  must_not_claim: ["活跃用户下降是大盘季节性回落造成的", "这是运营活动结束后用户回流减少、用户自然流失",
                   "各 App 版本的活跃用户同步走低,属全站现象"]
distractors: ["全站 active_users 两窗只降 3.99%,detect_anomaly 给出 is_anomaly=False(未过 15% 阈值)",
             "该版本的用户 5 月仍在活跃(不是版本下线),是留存曲线掉了台阶",
             "其余三个版本降幅都在 ±2% 以内,「各版本同步走低」不成立"]
slice_occupancy:
  dimension: version
  keys: [V4.2.0]
  window: [2026-03-08, 2026-05-08]
overlap_with: []
note: "引擎行为:version 是派生维度(字段 app_version 直接住在事实表上),层级只有 app_version
  一层 —— 没有更浅的版本分组可停,所以这个 case 的「深度」就是必须报出具体版本号,停在任何
  聚合口径(全站 / 渠道)都拿不到这个切片。窗口取 04-08 前后各 30 天(03-08~04-07 与
  04-08~05-08),两段等长。"
