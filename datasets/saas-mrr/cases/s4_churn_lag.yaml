# s4 流失与新签放缓并存(L2:单账户流失,干扰项是同期「新签放缓」)
#
# 数据锚点(2026-01 → 2026-02,AttributionEngine 实测;金额单位 = 元):
#   全量 mrr(末日水平口径)   234,175 → 189,379   -19.13%
#   企业版                     71,964 →  23,988   -66.67%
#   其余套餐                   基础版 +2.38% / 专业版 +5.17% / 旗舰版 0% / 试用版 0%
#   流失流 churn_mrr           -598 → -47,976
#   其中 ACC_E001(苏州致远科技有限公司)2026-02-20 流失,带走 24 席 × ¥1,999 = -¥47,976
#     = 2 月流失流的 100.00%,= 全量降幅 -44,796 的 107.10%(>100%:2 月新签 +4,077
#     与其它套餐的增长抵掉了一部分)
#   新签流 new_mrr             +28,164 → +4,077(企业版 2 月零新签)—— 伴生现象,不是主因
#   分解(2025-07-01 原点,残差 0):churn -47,976(贡献 1.0710)/ new +4,077 /
#     contraction -897 / expansion 0
#   异常检测:变化率 +11.56% → is_anomaly=False(基线 = 窗口前 4 周同星期几中位数 ¥209,909,
#     对比 = 窗口内日值中位数 ¥234,175 —— 28 天里前 19 天都在流失之前,中位数落在流失前,
#     符号因此是正的,见 note)
#
# 对账(铁律一在真实数据上的样子):企业版水平降幅 -¥47,976 与 2 月流失流 -¥47,976 同额;
# ACC_E001 自 2026-02-20 起在快照表里再没有一行(水平 0),它的累计变动 -¥47,976 也
# 精确等于 2 月 19 日的水平 —— 快照与变动两张表对同一事件给出同一个整数。
id: s4_churn_lag
tier: L2
category: SaaS
question: "为什么 2026 年 2 月的 MRR 环比 1 月下降了两成?是哪一块出的问题?"
expected:
  root_cause_slice:
    dimension: account
    level: account_id
    key: ACC_E001
    label: 苏州致远科技有限公司
  mechanism: "企业版 ACC_E001 于 2026-02-20 流失,单月带走 24 席 × ¥1,999 = ¥47,976,
    占 2 月流失流的 100%,是全量 -19.13% 的主因;同期企业版零新签(新签流从 +28,164
    掉到 +4,077)是与流失并存的伴生现象,不是原因"
  contribution_range: [0.85, 1.15]
  required_depth: account_id
  must_not_claim: ["企业版客户批量流失", "全站各套餐同步下滑", "新签放缓是主因"]
distractors: ["2 月企业版零新签(新签流 +28,164 → +4,077):与流失同期发生,是伴生现象",
             "基础版/专业版 2 月还在涨(各 +2.4% / +5.2%),企业版之外没有下滑"]
slice_occupancy:
  dimension: account
  keys: [ACC_E001]
  window: [2026-02-01, 2026-02-28]
overlap_with: []
note: "干扰项(新签放缓)与主因(流失)在时间上完全重叠:2 月企业版既零新签又流失一个大户,
  只有把两者分别落到「流」上才分得清 —— 流失 -47,976 是水平事件(不可逆),新签放缓只是
  增量变小。另外这条 -19.13% 的月度下滑同样不触发 detect_anomaly(+11.56%):基线取窗口前
  4 周同星期几中位数(¥209,909)、对比取窗口内日值中位数(¥234,175),而 2 月 28 天里前 19 天
  都在流失之前,中位数落在流失之前 —— 变化率因此是正的,「先异常后归因」在这里会直接空转。
  单点流失要让中位数动,得发生在窗口前半段。"
