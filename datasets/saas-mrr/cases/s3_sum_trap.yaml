# s3 跨期求和陷阱(L3:先识破口径,再定位到大额降配的账户)
#
# 数据锚点(2026-04 → 2026-05,AttributionEngine 实测;金额单位 = 元):
#   全量 mrr(末日水平口径,正确)   252,381 → 195,273   -22.63%
#   基础版                          61,281 →  16,731   -72.70%(降幅绝对值最大)
#   降配流 contraction_mrr(全量)     -198 →  -44,847
#   其中 ACC_B001(武汉致远科技有限公司)2026-05-28 降配 -450 席 = -¥44,550
#     = 全量降幅的 78.01%,= 5 月降配流的 99.34%,= 基础版降幅的 100%
#   分解(2025-07-01 原点,残差 0):contraction -44,847(贡献 0.7853)/ churn -13,455
#     (0.2356)/ expansion +1,194 / new 0
#   异常检测:变化率 -2.94% → is_anomaly=False(基线 = 窗口前 4 周同星期几中位数 ¥247,386,
#     对比 = 窗口内日值中位数 ¥240,122;5/28 的断崖只落在 31 天里的最后 4 天,中位数仍停在
#     下调前的水平上 —— 中位数对「窗口末端的台阶」不敏感,见 note)
#
# 「试用潮」摆锤:36 个试用账户 4 月初签约、5 月中旬到期流失,两种口径给两个主因 ——
#   末日水平口径(正确):每户在 04-30 还有 ¥299,到 05-31 已没有行(该侧按 0 计入)
#     → 每户切片变化 -¥299、合计 -¥10,764,排名从第 2 名起(每户只有 ACC_B001 的 1/149),
#     盖不过真主因;它们真实的流失流是 churn_mrr -¥10,764(占 5 月降幅 18.8%)。
#   逐日求和口径(错误):4 月整月都在(求和 301,990)、5 月只剩半个月(求和 106,743)
#     → 求和后「掉」了 ¥195,247,比真正主因的求和口径(-¥128,700)还大 → 误判成主因。
#   全量层面同理:4 月求和 7,352,404 → 5 月求和 7,396,241(+0.60%,连符号都反了);
#   把「2026 上半年」逐日相加得到 39,503,533 元,是真实水平(末日值 154,332)的 256 倍。
id: s3_sum_trap
tier: L3
category: SaaS
question: "为什么 2026 年 5 月的 MRR 总量比 4 月掉了一大截?主要是哪一块掉下来的?"
expected:
  root_cause_slice:
    dimension: account
    level: account_id
    key: ACC_B001
    label: 武汉致远科技有限公司
  mechanism: "基础版 ACC_B001 于 2026-05-28 一次性降配 -450 席(500 → 50 席),
    单月损失 ¥44,550:占全量降幅 -57,108 的 78.01%、5 月降配流 -44,847 的 99.34%,
    是 5 月 MRR -22.63% 的主因;试用客户 5 月中旬到期流失(¥10,764)是次要因素"
  contribution_range: [0.70, 1.10]
  required_depth: account_id
  must_not_claim: ["试用客户到期是主因", "试用客户批量流失是主要原因", "各套餐同步下滑"]
distractors: ["4 月签约的 36 个试用账户 5 月中旬到期:逐日求和口径下「掉」¥195,247(比主因还大),
             末日口径下每户 -¥299、合计 -¥10,764(与真实流失流同额)",
             "把两个月的求和相加:MRR 是半可加指标,求和值不是任何真实水平(4+5 月合计 14,748,645 元 = 末日值的 75 倍)"]
slice_occupancy:
  dimension: account
  keys: [ACC_B001]
  window: [2026-05-01, 2026-05-31]
overlap_with: []
note: "本 case 的双重陷阱:①口径 —— 问题里的「总量」诱导逐日求和,而 MRR 是半可加指标
  (口径错误时 4→5 月甚至是「上涨 +0.60%」,符号都反了);②排名 —— 即使口径正确,
  contribute('mrr', 'account', 'account_id') 返回的是**加法分支**的 top(条目键
  {key,label,base,cmp,change,contribution},没有 change_rate),按 change 升序:实测
  ACC_B001 以 -¥44,550(49,500 → 4,950,-90%)排第 1(contribution 0.7801),36 个试用账户
  从第 2 名起每户 -¥299(04-30 有行、05-31 没有行 → 该侧按 0 计入),不会占榜首。
  另有异常检测盲区:这条 -22.63% 的月度下滑不触发 detect_anomaly(-2.94%)—— 基线取窗口前
  4 周同星期几中位数(¥247,386)、对比取窗口内日值中位数(¥240,122),而 5/28 的降配落在
  31 天里的最后 4 天,中位数仍停在下调前的水平上。"
