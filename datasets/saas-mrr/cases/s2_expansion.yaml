# s2 增长熄火(L3:先看清「增长」的两段对比,再定位到一次性扩容的账户)
#
# 数据锚点(AttributionEngine 实测;金额单位 = 元):
#   专业版末日水平   2026-02-28 36,478 → 03-31 73,255(+36,777,+100.82%)
#                    → 04-30 76,843(+3,588,+4.90%)→ 05-31 77,740(+897)
#   扩张流 expansion_mrr(全量)  2026-03 +37,076 / 2026-04 0(归零)/ 2026-05 +1,194
#     其中 ACC_P001(成都致远科技有限公司)2026-03-08 一次性扩容 +118 席 = +¥35,282
#       = 3 月扩张流的 95.16%,= 3 月专业版水平增量的 95.94%
#   分解(2025-07-01 原点,残差 0):
#     2026-03 段 expansion +37,076 / new +3,576 / contraction -396 / churn -598(Σ +39,658)
#     2026-04 段 expansion 0 / new +24,738 / contraction -198 / churn -1,196(Σ +23,344)
#   异常检测:2026-04 全量 +6.76% → is_anomaly=False(基线 = 窗口前 4 周同星期几中位数
#     ¥227,053,对比 = 窗口内日值中位数 ¥242,391;指标还在涨,「熄火」是二阶的量,见 note)
#
# 本 case 问的不是「跌了多少」而是「为什么不再涨」:4 月 MRR 没有下滑,它只是不再增长 ——
# 专业版的增量从 +36,777 掉到 +3,588,原因是 3 月那笔一次性扩容没有第二次。
# 干扰项:4 月全量新签 +¥24,738(半年最高),新签没有放缓;试用版水平 4 月翻倍(+123%)
# 是 3 月底的试用潮签约(挂在 s3),与专业版无关。
id: s2_expansion
tier: L3
category: SaaS
question: "为什么 2026 年 4 月专业版的收入几乎停止增长了?是哪里出了问题?"
expected:
  root_cause_slice:
    dimension: account
    level: account_id
    key: ACC_P001
    label: 成都致远科技有限公司
  mechanism: "专业版 ACC_P001 在 2026-03-08 一次性扩容 +118 席(+¥35,282,占 3 月扩张流的
    95.16%),4 月没有第二笔扩张 —— 专业版的月度增量因此从 +36,777(+100.82%)塌到
    +3,588(+4.90%),扩张流从 +37,076 归零"
  contribution_range: [0.85, 1.15]
  required_depth: account_id
  must_not_claim: ["专业版 4 月收入下滑", "客户流失加剧是主要原因", "新签不足是主要原因"]
distractors: ["4 月全量新签 +¥24,738(半年最高),新签并未放缓 —— 熄火的是扩张不是获客",
             "试用版 4 月水平翻倍是试用潮签约(与 s3 同源),不是专业版的增长"]
slice_occupancy:
  dimension: account
  keys: [ACC_P001]
  window: [2026-03-01, 2026-03-31]
overlap_with: []
note: "两条判读风险:①「增长熄火」不是异常 —— detect_anomaly 只判「窗口内日值中位数 vs
  窗口前 4 周同星期几中位数」(4 月:¥242,391 vs ¥227,053 = +6.76%),它看不见「增速结构变了」
  这种二阶问题(专业版水平 3 月 +100.82% → 4 月 +4.90%,扩张流 +37,076 → 0,而指标本身还在涨);
  任何「先找异常再归因」的路径在这里都启动不了,必须接受「指标没跌但增量没了」这类问题;
  ②口径必须是「水平的两段差」而不是求和(半可加):专业版 4 月逐日求和 2,255,058 元是 3 月
  2,014,662 元的 1.12 倍,单看求和看不出熄火。"
