# s1 大客户流失(L2:单切片直降,下钻两层到账户)
#
# 数据锚点(2026-05 → 2026-06,AttributionEngine 实测,非估计值;金额单位 = 元):
#   全量 mrr(末日水平口径)   195,273 → 154,332   -20.96%
#   旗舰版                     72,927 →  35,964   -50.68%(全站最陡的套餐)
#   其余套餐                   企业版 0.00% / 专业版 -0.77% / 基础版 -7.69% / 试用版 -53.85%
#                              (试用版只掉 ¥2,093 = 旗舰版降幅的 1/18;没有同步下滑)
#   流失流 churn_mrr(全量)   -13,455 → -40,343   环比 +199.85%
#   其中 ACC_F001(西安致远科技有限公司)2026-06-15 流失,带走 37 席 × ¥999 = -¥36,963
#     = 6 月流失流的 91.62%,= 全量降幅 -40,941 的 90.29%
#   分解(2025-07-01 原点,Σ效应 = 总变化,残差 0):
#     churn -40,343(贡献 0.9854)/ contraction -598 / new、expansion 均为 0
#   异常检测:is_anomaly=True(kind=level_shift,变化率 -35.23%,robust_z=-63.61)
#     基线 = 窗口前 4 周同星期几中位数 ¥240,122,对比 = 窗口内日值中位数 ¥155,528
#
# 干扰项:榜首之外的 4 个切片合计只有 -¥3,978(占降幅 9.7%)—— ACC_B104 -¥1,287、
#   ACC_T110 -¥1,196、ACC_T108 -¥897 三个小客户流失 + ACC_P108 -¥598 降配;都真实存在,
#   但量级只有 ACC_F001 的 1/9 ~ 1/29,不能并列成「多个客户同时流失」。
# 另有一类「跨窗口搬来的干扰」:36 个试用账户(4 月签约、5 月中旬到期)在这一段两侧的
#   基准日(05-31、06-30)都没有行,所以**完全不进这份榜单**(既不是 0 也不是 -100%);
#   它们的流失是 5 月的事,是 s3 的干扰项。
id: s1_churn
tier: L2
category: SaaS
question: "为什么 2026 年 6 月的 MRR 环比 5 月明显下滑?是全站性问题还是个别客户?"
expected:
  root_cause_slice:
    dimension: account
    level: account_id
    key: ACC_F001
    label: 西安致远科技有限公司
  mechanism: "旗舰版大客户 ACC_F001 于 2026-06-15 流失,单月带走 37 席 × ¥999 = ¥36,963,
    占 6 月流失流的 91.62%、全量降幅的 90.29%;其余套餐基本没动 —— 企业版 0%、专业版 -0.77%、
    基础版 -7.69%(-¥1,287)、试用版 -53.85%(-¥2,093,基数是 ¥3,887,降幅百分比大但绝对量只有
    ACC_F001 的 1/18),是全量 -20.96% 的唯一主因"
  contribution_range: [0.80, 1.10]
  required_depth: account_id
  must_not_claim: ["全站各套餐同步下滑", "整体自然回落是唯一原因", "试用客户到期是主因"]
distractors: ["榜首之外的 4 个小切片合计 -¥3,978(占降幅 9.7%):ACC_B104 -¥1,287、ACC_T110 -¥1,196、
              ACC_T108 -¥897 三个小客户流失 + ACC_P108 -¥598 降配 —— 真实,但不是主因",
             "36 个试用账户(4 月签约、5 月中旬到期)在本段两侧基准日都没有行,完全不进榜单;
              它们合计 -¥10,764 的流失发生在 5 月(占 5 月流失流 -¥13,455 的 80%),是 s3 的干扰项"]
slice_occupancy:            # §5.10 约束 1:本 case 的影响集合
  dimension: account
  keys: [ACC_F001]
  window: [2026-06-01, 2026-06-30]
overlap_with: []
note: "引擎行为(实测,主因一次下钻即可命中,不需要绕开任何东西):mrr 是半可加指标,
  contribute('mrr', 'account', 'account_id', …) 走**加法分支** —— 引擎的分支只看
  additive/semi_additive 与 derived/ratio 之分,半可加不属于 derived;返回的 top 条目键是
  {key,label,base,cmp,change,contribution},**没有 change_rate**,按 change 升序、并列按 key。
  切片两侧各取「窗口内**全局**最后有数据日」的水平(05-31 / 06-30):ACC_F001 在 05-31 还有
  37 席 = ¥36,963,到 06-30 已没有行(该侧按 0 计入,见语义层 caveat)→ change -¥36,963,
  直接是榜首(contribution 0.9028)。换流失流 churn_mrr 下钻结论相同(ACC_F001 的 contribution
  1.3747 —— 分母是 churn_mrr 自身的变化 -¥26,888,而 5 月已流失的账户在这一段里是正向变化,
  所以 >1 正常)。"
