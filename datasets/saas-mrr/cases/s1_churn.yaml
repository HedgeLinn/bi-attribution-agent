# s1 大客户流失(L2:单切片直降,下钻两层到账户)
#
# 数据锚点(2026-05 → 2026-06,AttributionEngine 实测,非估计值;金额单位 = 元):
#   全量 mrr(末日水平口径)   195,273 → 154,332   -20.96%
#   旗舰版                     72,927 →  35,964   -50.68%(全站最陡的套餐)
#   其余套餐                   企业版 0.00% / 专业版 -0.77% / 基础版 -7.69% —— 没有同步下滑
#   流失流 churn_mrr(全量)   -13,455 → -40,343   环比 +199.85%
#   其中 ACC_F001(西安远澜科技有限公司)2026-06-15 流失,带走 37 席 × ¥999 = -¥36,963
#     = 6 月流失流的 91.62%,= 全量降幅 -40,941 的 90.29%
#   分解(2025-07-01 原点,Σ效应 = 总变化,残差 0):
#     churn -40,343(贡献 0.9854)/ contraction -598 / new、expansion 均为 0
#   异常检测:is_anomaly=True(kind=level_shift,变化率 -35.23%,robust_z=-63.61)
#
# 干扰项:4 月签约的 36 个试用账户 5 月中旬到期流失(累计 -¥10,764,占全量降幅 26.3%)。
# 它们在 5 月已经死掉,所以在「5 月 → 6 月」这一段里以 -100% 的变化率占据榜首,
# 但每户只有 ¥299 —— 按变化率排名的 contribute('mrr', …, 'account_id') 会把 36 个
# 小账户排在真正的 -¥36,963 前面(见 note)。
id: s1_churn
tier: L2
category: SaaS
question: "为什么 2026 年 6 月的 MRR 环比 5 月明显下滑?是全站性问题还是个别客户?"
expected:
  root_cause_slice:
    dimension: account
    level: account_id
    key: ACC_F001
    label: 西安远澜科技有限公司
  mechanism: "旗舰版大客户 ACC_F001 于 2026-06-15 流失,单月带走 37 席 × ¥999 = ¥36,963,
    占 6 月流失流的 91.62%、全量降幅的 90.29%;其余套餐(企业版 0%、专业版 -0.77%)
    基本没动,是全量 -20.96% 的唯一主因"
  contribution_range: [0.80, 1.10]
  required_depth: account_id
  must_not_claim: ["全站各套餐同步下滑", "整体自然回落是唯一原因", "试用客户到期是主因"]
distractors: ["4 月签约的 36 个试用账户 5 月中旬集中到期流失(累计 -¥10,764,占降幅 26.3%,次要因素)",
             "按变化率排序时这 36 个账户以 -100% 占据榜首,但每户只有 ¥299"]
slice_occupancy:            # §5.10 约束 1:本 case 的影响集合
  dimension: account
  keys: [ACC_F001]
  window: [2026-06-01, 2026-06-30]
overlap_with: []
note: "引擎行为(定位这条主因必须绕开它):mrr 是半可加指标,contribute('mrr', 'account',
  'account_id', …) 走 derived 分支 —— 返回的 top 按 change_rate 升序、contribution 为 null,
  而「死在对比期中段」的账户切片变化恒为 0(ACC_F001 于 6/15 流失,切片取它到期前最后一天
  的 37 席水平 → 变化 0),所以它根本不进这份榜单。正确路径是用加法流指标
  churn_mrr 按 account_id 下钻(顶层切片可加,ACC_F001 一家占 91.62%)。"
