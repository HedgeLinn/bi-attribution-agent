# d2 品牌词加预算不带来增量(「无法归因」类:L2,考口径与增量思维)
#
# 数据锚点(AttributionEngine 实测;窗口 2026-07-01~07-24 vs 2026-08-01~08-24,等长 24 天):
#   CAMP_TM_01(天猫直通车-品牌词,2026-08-01 起预算 +60%):
#     ad_cost   13,747,159 → 21,836,515 分(137,472 → 218,365 元,+58.84%)
#     ad_impr    1,902,020 →  3,054,791(+60.61%)
#     cpa        2,749.4 → 4,231.1 分(+53.90%)      ← 转化成本被推高一半以上
#     cvr        4.0008% → 2.5998%(-35.02%)         ← 转化率被摊薄(0.65×)
#     ad_conv        5,000 → 5,161(+3.22%)
#     biz_orders     4,062 → 4,196(+3.30%)
#   边际账:多花 80,894 元、多 134 单 → 边际 603.7 元/单,而基线是 33.8 元/单(≈ 17.9 倍)。
#   对照面(0 消耗):自然流量 biz_orders 07-01~24 = 5,807 → 08-01~24 = 5,774(-0.57%),
#     品牌词多拿到的 134 单并不是「原来不会发生」的需求。
#   品牌词计划(全部品牌词渠道)8 月前 24 天消耗 379,029 元 = 全站 2,607,371 元的 14.54%。
#
# 正确答案:品牌词吃的是**本来就会来的**搜索需求(用户已经在搜品牌名),把预算加 60%
#   只是把同一批需求的竞价抬高(cvr 被摊薄、cpa 涨 54%),订单只多 3.3% —— 是量级上的
#   「买贵了」,不是增量。不能归因成「投放带来了增长」,更不该继续加预算。
# 数值维不评:无根因切片(null-root)。
id: d2_brand_trap
tier: L2
category: 归因陷阱
question: "8 月把天猫直通车-品牌词的预算加了 60%,订单涨了一点,要不要继续加?这算投放带来的增长吗?"
expected:
  root_cause_slice: null        # 「无法归因」类:没有可下钻的根因切片(这是口径/增量判断)
  mechanism: "CAMP_TM_01 预算 +60% 换来曝光 +60.61%、消耗 +58.84%,而转化率被摊薄 35.02%
    (4.0008% → 2.5998%)、转化成本涨 53.90%,业务订单只 +3.30%(4,062 → 4,196)——
    边际成本 603.7 元/单 vs 基线 33.8 元/单(17.9 倍);同期零消耗的自然流量订单 -0.57%,
    说明品牌词拿到的是本来就会发生的需求,不是增量"
  contribution_range: null      # 无根因切片 → 不评数值维
  required_depth: campaign_id   # 名义声明(null-root 时深度维跳过);品牌词口径在 hierarchy 的 is_brand 层
  must_not_claim: ["品牌词加预算带来了转化增量", "建议继续给品牌词加预算",
                   "品牌词投放是这次增长的主要驱动"]
distractors: ["订单确实涨了 3.3%(容易被读成「加预算有效」,但 cpa 同时涨了 54%)",
             "全站 8 月还叠加着 b5/b6 两个坑,不要把它们的效果算到品牌词头上"]
slice_occupancy:                # 全局量(无切片):品牌词口径,8 月全月
  dimension: date
  keys: ["2026-08-01", "2026-08-31"]
  window: [2026-08-01, 2026-08-31]
overlap_with: [c1_conv_backfill, c2_conv_overclaim, d3_correlation]
note: "例外声明(§5.10 约束 1):本 case 的观察对象是品牌词口径的增量判断(全局量),
  窗口与 c1(8 月末回传缺失)、c2/d3(全区间)重叠,显式声明为「允许叠加」。
  引擎行为:品牌词 / 非品牌词是 campaign 维度 hierarchy 里的口径开关(is_paid / is_brand),
  必须先在**这一层**分开口径再谈投放增量 —— 混着算会把自然流量与品牌词一起算成投放效果。"
