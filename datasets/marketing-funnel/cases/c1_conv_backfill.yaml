# c1 平台回传系统性缺数(「无法归因」类:L2,考口径意识与诚实度)
#
# 数据锚点(AttributionEngine 实测):
#   全站平台口径转化 ad_conv:
#     2026-08-11~08-17 = 7,843 / 08-18~08-24 = 7,952 / **08-25~08-31 = 2,340**(-70.57%)
#   按渠道看 08-25~31 vs 08-18~24(五个渠道**同比例**下跌,幅度 -68.4% ~ -71.7%):
#     CH_DY 3,752 → 1,063(-71.67%)/ CH_XHS 796 → 236 / CH_WX 658 → 208 /
#     CH_TM 2,115 → 640 / CH_JD 631 → 193
#   同期「没有变」的旁证:
#     ad_clicks 485,329 → 473,791(-2.38%)   ← 点击没变
#     track_sessions 371,673 → 367,652(-1.08%)  ← 埋点会话没变
#     biz_orders 8,139 → 8,050(-1.09%)       ← 业务订单没变
#   两套口径的关系被翻转:正常时平台口径 ≈ 付费业务订单 × 1.23(6/7 月实测 1.2300/1.2302),
#   而这一周平台口径 2,340 < 业务订单 8,050 —— 平台口径反而更少。
#
# 正确答案:这是平台回传的**比例性缺失**(语义层 caveats 第 2 条),不是业务变化:
#   点击、会话、订单三条独立旁证都没动,而转化整体按同一比例少掉 70% ——
#   真实业务下滑不可能让五个渠道跌到同一个百分比上。没有可归因的根因切片。
# must_not_claim 用完整断言短语:诚实的排除陈述里出现的是「是不是回传缺失」这类问句,
#   不是「投放效果真实恶化了」这样的结论句。
id: c1_conv_backfill
tier: L2
category: 数据质量
question: "8 月最后一周平台口径的转化数掉了 70%,是不是投放出大问题了?"
expected:
  root_cause_slice: null        # 「无法归因」类:正确答案是没有根因切片
  mechanism: "平台口径转化自 2026-08-25 起只剩 30% 左右(7,952 → 2,340):五个渠道**同比例**
    下跌(-68.4% ~ -71.7%),而同期点击 -2.38%、埋点会话 -1.08%、业务订单 -1.09% 全部正常,
    两套口径的关系(平台 ≈ 付费订单 × 1.23)被翻转 —— 是平台回传缺失(比例性缺数),
    不是真实的效果下滑"
  contribution_range: null      # 无根因切片 → 不评数值维
  required_depth: date_id       # 名义声明:根因切片为 null 时深度维跳过(视为通过)
  must_not_claim: ["近一周投放效果真实恶化了", "应当立即降低预算止损",
                   "平台口径转化下降是投放策略问题"]
distractors: ["时间上正好与 8 月的两个坑重叠(b5 频次疲劳、b6 素材被拒),顺手归因给它们就错了",
             "8 月整月的平台/付费订单比值被压到 1.0388(被这 7 天拖低),不是口径在收紧"]
slice_occupancy:                # 全局量(无切片):平台口径的回传完整性
  dimension: date
  keys: ["2026-08-25", "2026-08-31"]
  window: [2026-08-25, 2026-08-31]
overlap_with: [b4_budget_cap, b5_frequency_fatigue, b6_creative_rejected, c2_conv_overclaim,
               d2_brand_trap, d3_correlation]
note: "例外声明(§5.10 约束 1):本 case 的观察对象是全局量(平台口径的完整性),其窗口与
  b4/b5/b6/d2 的埋点窗重叠,且 c2(全局口径常量)与 d3(全局节律)本就覆盖全区间 ——
  显式声明为「允许叠加」:它们不是本 case 的候选根因,本 case 也不解释它们的现象。"
