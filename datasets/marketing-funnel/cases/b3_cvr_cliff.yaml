# b3 一周 CVR 塌陷而 CTR 不变(L2:切片 > 计划;漏斗坑)
#
# 数据锚点(AttributionEngine 实测):
#   CAMP_TM_02(天猫直通车-类目词)
#     cvr  2026-03-09~03-15 = 1.2991%  →  2026-03-16~03-22 = 0.7795%   -40.00%
#     ctr  同期 3.0277% → 3.1240%(+3.18%,**没动**)
#     ad_clicks 同期 42,029 → 44,003(+4.70%,点击量不降反升)
#     ad_conv  同期 546 → 343(-37.18%)
#     cvr 2026-03-23~03-29 = 1.2986% —— 下一周就回到事发前(03-09~15 = 1.2991%)的水位
#   contribute('ad_conv','campaign','campaign_id', 03-09~15 → 03-16~22):
#     全站 7,608 → 7,391(总变化 -217),CAMP_TM_02 变化 -203 → **贡献 0.9355**
#     —— 全站那一周的转化缺口几乎全是它一家。
#
# 正确答案:问题卡在漏斗的「点击 → 转化」这一段(落地页 / 转化链路),而且只在
# 2026-03-16~03-22 这一周;流量侧(曝光、点击、点击率)完全正常。
# 数值维不评:根因指标 cvr 是比率指标,contribution 恒为 null;而 ad_conv 的贡献度对
#   **窗口极敏感**(实测:03-09~15→03-16~22 = 0.9355;03-01~15→03-16~31 = -0.17;
#   03-16~22→03-23~29 时该计划根本进不了 top 榜)—— 声明任何区间都会误伤换窗口的诚实答案。
#
# trap(§5.4):只看「整体转化」这一层,会把它归因成「直通车渠道不行」;而渠道里同期的
#   另一个计划 CAMP_TM_01(品牌词)没有这一跌 —— 是单计划的突发,不是渠道共性。
id: b3_cvr_cliff
tier: L2
category: 漏斗
question: "天猫直通车-类目词(CAMP_TM_02)2026 年 3 月 16 日那一周转化率掉了 40%,是不是这个渠道不行了?"
expected:
  root_cause_slice:
    dimension: campaign
    level: campaign_id
    key: CAMP_TM_02
    label: 直通车-类目词
  mechanism: "CAMP_TM_02 在 2026-03-16~03-22 一周转化率 -40.00%(1.2991% → 0.7795%),
    而同期点击率 +3.18%、点击量 +4.70% 完全正常 —— 塌陷只发生在「点击→转化」这一段,
    该计划的转化缺口占全站当周缺口的 93.55%;不是渠道流量问题,也不是创意/出价问题"
  contribution_range: null      # 比率指标(cvr)→ 贡献度恒为 null;ad_conv 的贡献度窗口敏感,见文件头
  required_depth: campaign_id
  must_not_claim: ["天猫直通车渠道整体转化能力下降是本次下滑的原因", "这是全渠道共同的转化率衰退",
                   "应当暂停该计划的投放止损"]
distractors: ["全站当周转化同步下降(该计划占了缺口的 93.55%,全站下降是它的结果)",
             "CAMP_TM_01(同渠道品牌词计划)同期没有这一跌,可作对照"]
slice_occupancy:
  dimension: campaign
  keys: [CAMP_TM_02]
  window: [2026-03-16, 2026-03-22]
overlap_with: []
note: "引擎行为:必须在 campaign 维度下钻到 campaign_id 并按**周**取窗(03-16~03-22)——
  按月取窗会把这一周的塌陷摊薄到看不出来。分解路径:ctr 与 cvr 是两个独立因子
  (ctr = 点击/曝光、cvr = 转化/点击),一个持平一个塌陷,恰好把责任锁定在转化段。"
