# c2 两套口径差 23%(「无法归因」类:L2,考口径归属)
#
# 数据锚点(AttributionEngine 实测):
#   平台口径转化 ad_conv  vs  业务付费订单 biz_orders{is_paid: 付费}
#     2026-06 全月  44,104  vs  35,856   → 1.2300
#     2026-07 全月  33,165  vs  26,960   → 1.2302     ← 恒定比值,不是某天的错数
#     2026-08 全月  29,503  vs  28,400   → 1.0388     ← 被 c1 的回传缺失污染,别当口径变了
#   同期全量业务订单(含自然流量/私域)7 月 = 34,463 单(付费 26,960 + 自然 7,503)
#   平台口径比付费业务订单**多 6,205 单(+23.02%)**
#
# 正确答案:两套口径不可混。业务订单是唯一准绳(语义层 caveats 第 1 条);平台口径的
#   转化是**回传值**,与业务订单没有恒等关系,差额来自平台归因口径(跨设备/归因窗口补记),
#   不是业务漏记、也不是可以互相加减的同一件事。汇报「整体成交」用业务订单;
#   平台口径只在平台内部同口径比较时使用。
# 数值维不评:无根因切片(null-root)。
# must_not_claim 的三句都是**动作型错误结论**(诚实答案里出现的是「不能用平台口径算总 GMV」
#   这样的否定句,而这里列的是肯定句;scorer 是子串匹配,故刻意避免短词)。
id: c2_conv_overclaim
tier: L2
category: 数据质量
question: "平台后台说 7 月转化了 33,165 单,业务系统里 7 月只有 34,463 单(付费订单 26,960 单),两边对不上,我该用哪个数对外汇报?"
expected:
  root_cause_slice: null        # 「无法归因」类:口径差异不是一个可下钻的根因切片
  mechanism: "平台口径转化(33,165)比业务付费订单(26,960)多 6,205 单 = +23.02%,
    且 6 月同为 +23.00% —— 是两套口径之间**恒定**的差异(平台回传采用另一套归因口径),
    不是某天的数据错误;业务订单是唯一准绳,平台口径不能当成交数、两套口径不能相加"
  contribution_range: null      # 无根因切片 → 不评数值维
  required_depth: date_id       # 名义声明:根因切片为 null 时深度维跳过(视为通过)
  must_not_claim: ["应当以平台口径的转化数计算整体 GMV", "两套口径的差额是业务订单漏记造成的",
                   "平台口径转化与业务订单可以直接相加减"]
distractors: ["6 月的平台口径转化比 7 月还高 33%(那是 618 大促的需求脉冲,不是口径问题)",
             "8 月比值掉到 1.0388(是 c1 的回传缺失压低了平台口径,别误读成「口径在收紧」)"]
slice_occupancy:                # 全局量(无切片):两套口径之间的恒定关系,覆盖全区间
  dimension: date
  keys: ["2026-03-01", "2026-08-31"]
  window: [2026-03-01, 2026-08-31]
overlap_with: [b1_ctr_decay, b2_cpc_surge, b3_cvr_cliff, b4_budget_cap, b5_frequency_fatigue,
               b6_creative_rejected, c1_conv_backfill, c3_timezone_shift, c4_tracking_gap,
               c5_pause_gap, d1_promo_hangover, d2_brand_trap, d3_correlation]
note: "例外声明(§5.10 约束 1):本 case 是一条**每天都成立**的全局口径常量(不是局部异常),
  必然与全部 case 的时间窗重叠 —— 显式声明为「允许叠加」。它不制造任何局部异常,
  只约束「跨口径比较」的读法;反过来,别的 case 也不会让这个比值发生变化(除非 c1 那样
  打到平台口径本身)。"
