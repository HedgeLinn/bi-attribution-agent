# b1 素材按「投放天数」衰减(L2:切片 > 素材;漏斗坑)
#
# 数据锚点(AttributionEngine 实测,非估计值):
#   CR_TT_007(抖音B-竖版剧情,所属 CAMP_DY_01,投放期 2026-05-20 ~ 2026-07-31)
#     ctr 2026-06-20~07-04 = 2.0736%  →  2026-07-15~07-29 = 1.2560%   -39.43%
#     ad_clicks 同期 80,023 → 50,412(-37.00%),曝光同期基本持平
#     **按投放天数**分 7 桶(dim_creative.launch_date = 05-20 起算,引擎逐窗实测):
#       第 1~10 天 2.9006% / 11~20 天 2.8312% / 21~30 天 2.5578% / 31~40 天 2.1901%
#       41~50 天 1.8053% / 51~60 天 1.5359% / 61~70 天 1.2064%
#       —— 严格单调下降,到期时只剩上线初期的 41.6%(= 1 - 0.011 × (70-11) 的斜率显形)
#   对照素材 CR_TT_001(同计划,2026-03-01 上线)同期 ctr 3.0124% → 3.0292%(+0.56%)
#   —— 同一个计划、同一个渠道、同一段时间:老素材纹丝不动,只有新素材在衰减。
#   按日历日逐日看则「毫无规律」:CAMP_DY_01 计划整体日级 ctr 在 93 天里上升 43 次,
#   素材自身日级在 62 天里上升 24 次(周末节律 ±5% 噪声 + 双素材混合)——
#   必须**按投放天数分桶**才能看见单调性(语义层 caveats 第 7 条)。
#
# 正确答案:CR_TT_007 到了衰退期,应更换/重跑新素材;不是渠道流量质量下滑。
# 数值维不评:根因指标 ctr 是比率指标,contribute('ctr', …) 的 contribution 恒为 null
# (引擎按 change_rate 排序),诚实答案只会写出 null —— 声明区间反而会误伤它。
id: b1_ctr_decay
tier: L2
category: 漏斗
question: "抖音-效果通投A(CAMP_DY_01)的点击率 7 月比 6 月中旬低了不少,是渠道流量变差了还是素材的问题?"
expected:
  root_cause_slice:
    dimension: creative
    level: creative_id
    key: CR_TT_007
    label: 抖音B-竖版剧情
  mechanism: "素材 CR_TT_007(2026-05-20 上线)自投放第 12 天起点击率递减衰减:按投放天数分桶
    2.90%→2.83%→2.56%→2.19%→1.81%→1.54%→1.21% 严格单调,两个月后只剩上线初期的 41.6%;
    同计划对照素材 CR_TT_001 同期 3.01%→3.03% 持平,渠道与大盘未变 —— 是素材自身进入衰退期,
    与「投放天数」相关,与日历日期无关"
  contribution_range: null      # 比率指标(ctr)的贡献度恒为 null,见文件头
  required_depth: creative_id
  must_not_claim: ["点击率下滑是抖音渠道流量质量变差造成的", "这是行业大盘点击率整体走低造成的",
                   "该素材仍在稳定期、无需更换"]
distractors: ["CAMP_DY_01 整体 CTR 也在下滑(它 55% 的曝光来自这条素材,是结果不是原因)",
             "逐日看曲线上下跳动没有任何单调性(需按投放天数聚合才显形)"]
slice_occupancy:                # §5.10 约束 1:本 case 的影响集合
  dimension: creative
  keys: [CR_TT_007]
  window: [2026-05-31, 2026-07-31]
overlap_with: []
note: "引擎行为:dim_creative.launch_date 是**唯一**能算出「投放天数」的字段(hierarchy 里
  也声明在 creative 这一维),这也是本 case 要求的下钻深度 —— 停在 campaign_id 或
  channel_id 层只能看到被混合稀释后的曲线。CR_TT_007 于 2026-07-31 退役,07-31 之后
  它的行消失(不是 0):按日历日画到的「断崖」是退役,不是 CTR 归零。"
