# b6 素材被拒 / 下架:曝光断崖而计费照跑(L2:切片 > 素材;数据质量坑)
#
# 数据锚点(AttributionEngine 实测):
#   CR_XHS_004(小红书B-视频种草,所属 CAMP_XHS_01,2026-07-06 上线)
#     ad_impr  2026-07-06~07-25 = 3,814,852  →  2026-08-05~08-24 = 196,091   -94.86%
#     ad_clicks 同期 100,964 → 5,041(-95.01%)
#     ad_cost   同期 17,163,713 → 17,144,937 分(**-0.11%,几乎没动**)
#     cpm       同期 4,499.18 → 87,433.57 分(×19.435)
#       —— 曝光掉了 95% 而消耗一分不少,千次曝光成本当然会「涨」19 倍:它是结果,不是买贵了。
#   对照 CR_XHS_001(同计划另一素材,2026-03-01 上线):
#     ad_impr 2,595,057 → 2,636,188(+1.58%),cpm 4,417.36 → 4,375.82 分(-0.94%)—— 正常。
#
# 正确答案:CR_XHS_004 在 2026-08-05 被平台拒审/下架:曝光与点击被掐掉(所以此前
#   投放「看着很正常」的是消耗,不是投放),而计费按「本该产生的点击」继续结算
#   (语义层 caveats 第 5 条:计费口径与实点击不一致)。要按消耗止损 / 走申诉,不是加预算。
# 数值维不评:ad_impr 是加法指标,contribute('ad_impr','creative','creative_id',
#   07-06~25 → 08-05~24)实测 CR_XHS_004 = -0.8672 —— 但那是**它自己的降幅占全站曝光
#   变化的比例**,而全站同期曝光是涨的(b5 的放大贡献了增量),分母随窗口剧烈变化,
#   声明区间会误伤换窗口的答案。
#
# trap(§5.4):只看消耗 → 以为在正常投放;必须把曝光/点击与消耗**交叉验证**。
id: b6_creative_rejected
tier: L2
category: 漏斗
question: "小红书-种草通投的素材『小红书B-视频种草』(CR_XHS_004)8 月的消耗看着很正常,它还在正常投放吗?"
expected:
  root_cause_slice:
    dimension: creative
    level: creative_id
    key: CR_XHS_004
    label: 小红书B-视频种草
  mechanism: "CR_XHS_004 自 2026-08-05 起曝光 -94.86%、点击 -95.01%(实投被平台掐断,
    多为素材被拒审 / 下架),而消耗仅 -0.11% —— 计费按本该有的点击继续结算,导致
    cpm 从 4,499 分虚涨到 87,434 分;同计划对照素材 CR_XHS_001 同期曝光 +1.58%、
    cpm 持平,可确证不是渠道或计划层面的问题"
  contribution_range: null      # 见文件头:ad_impr 的贡献度分母随窗口剧烈变化
  required_depth: creative_id
  must_not_claim: ["该素材仍在正常投放、无需处理", "曝光下滑是小红书平台流量大盘减少造成的",
                   "需要给该素材追加预算来恢复曝光"]
distractors: ["消耗没跌(±0.11%)—— 只看消耗的看板会显示这个素材「正常」",
             "cpm 涨了 19 倍,但它是曝光被掐的结果,不是买量变贵了",
             "该素材 2026-07-06 才上线,8 月本该是它的主力期"]
slice_occupancy:
  dimension: creative
  keys: [CR_XHS_004]
  window: [2026-08-05, 2026-08-31]
overlap_with: []
note: "引擎行为:两个指标必须一起看 —— 单看 ad_cost(加法指标,几乎为 0 的变化)会得出
  「正常投放」;单看 cpm(比率指标,×19.4)会得出「买量成本失控」。把 ad_impr 与 ad_cost
  并排(或按 creative_id 下钻看 daily 序列),2026-08-05 这一天两条线立刻分岔。"
