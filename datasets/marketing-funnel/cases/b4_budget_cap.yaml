# b4 日预算封顶(L2:切片 > 计划;漏斗坑)
#
# 数据锚点(AttributionEngine 实测):
#   CAMP_WX_02(视频号-扩量计划,日预算 800,000 分 = 8,000 元)
#     等长窗口 2026-03-01~03-30 → 2026-04-01~04-30:
#       ad_cost 34,718,645 → 24,025,662 分(-30.80%)
#       ad_impr  7,729,495 →  5,285,853(-31.61%)
#       4 月日均消耗 = 24,025,662 / 30 = **800,855 分** ≈ 日预算上限(平台抖动 ±0.6%)
#     2026-04-01~04-30 → 2026-07-01~07-30(再等长):
#       ad_cost 24,025,662 → 23,999,479 分(**-0.11%**)—— 三个月里全局需求涨了约 6%,
#       它一动不动:这是「被预算顶死」的形态,不是流量变少。
#   对照 CAMP_WX_01(同渠道、无封顶):03-01~30 → 04-01~30 只 -2.78%,之后随需求继续增长。
#
# 正确答案:运营在 2026-04-01 把该计划的日预算下调到了 8,000 元/天,消耗被顶在预算上;
#   曝光下降是「预算不够花」的结果,不是平台限流(平台限流的形态是消耗照花而曝光掉,
#   见 b6 —— 两者要分开)。
# 数值维不评:消耗虽然是加法指标,contribute('ad_cost','campaign','campaign_id',
#   03 月 → 07 月)也确实返回 CAMP_WX_02 = 0.4563,但那个分母(全站 312,466,334 →
#   288,280,573)是 b1/b5/c5 等**别的坑**造成的、换窗口就散;而本 case 的正确量级是
#   「日均消耗 ≈ 日预算 800,000 分」,不是一个贡献度 —— 声明区间等于逼答案换口径。
id: b4_budget_cap
tier: L2
category: 漏斗
question: "视频号-扩量计划(CAMP_WX_02)从 4 月开始消耗就上不去了,是平台限流还是我们自己的问题?"
expected:
  root_cause_slice:
    dimension: campaign
    level: campaign_id
    key: CAMP_WX_02
    label: 视频号-扩量计划
  mechanism: "CAMP_WX_02 自 2026-04-01 起日消耗被顶在 800,000 分(8,000 元)的日预算上
    (4 月日均 800,855 分):3 月 → 4 月消耗 -30.80%、曝光 -31.61% 同幅下滑,而 4 月 → 7 月
    等长窗口消耗几乎不变(-0.11%),需求上涨带不动它;对照计划 CAMP_WX_01 同期只 -2.78%
    且继续增长 —— 是预算封顶,不是流量或渠道问题"
  contribution_range: null      # 见文件头:分母被其它坑污染,正确量级是「日均 ≈ 日预算」
  required_depth: campaign_id
  must_not_claim: ["曝光下滑是平台限流造成的", "视频号流量大盘萎缩造成了消耗下降",
                   "需要提高出价抢回流量"]
distractors: ["全站消耗在 3 月 → 4 月也在下降(整体回落的大背景,但它只解释了 2.78 个百分点)",
             "03 月有 31 天、04 月只有 30 天,按整月直接比会凭空多算 3.2% 的跌幅(需等长窗口)"]
slice_occupancy:
  dimension: campaign
  keys: [CAMP_WX_02]
  window: [2026-04-01, 2026-08-31]
overlap_with: []
note: "引擎行为:验证「被顶在预算上」要看**形态**而非单点 —— 把该计划的日消耗序列拉出来,
  2026-04-01 起是一条贴着 800,000 分的水平线(平台抖动 ±0.6%),而曝光/点击/转化随之
  等比缩小(引擎幅度实测 -31% 左右一致)。dim_campaign.daily_budget 里就存着这个上限,
  按 campaign_id 下钻后取该字段即可确证。"
