# c3 两套日界造成的跨日错位(「无法归因」类:L2,考时间字段核对)
#
# 数据锚点(AttributionEngine 实测):
#   2026-04-21 有一批 340 单的「跨夜专场」(22:00~次日 02:00 北京时间):
#     biz_orders{channel_id: CH_PRIV}:  04-20 = 102 → **04-21 = 434**(+325%)→ 04-22 = 93
#     track_sessions{channel_id: CH_PRIV}: 04-20 = 4,969 → 04-21 = 4,408 → **04-22 = 20,674**
#   同一批订单在两套表上落在**相邻的两天**:业务订单的 date_id 取 UTC 日(04-21),
#   埋点按北京时间落库(北京 04-22 凌晨)→ 会话被记到 04-22,而且在埋点侧它还**多算了一次流量**。
#   两天合计看,两张表其实一致(都只多了这 340 单):
#     biz_orders 04-19~20 = 207  →  04-21~22 = 527(+154.6%)
#     track_sessions 04-19~20 = 9,795 → 04-21~22 = 25,082(+156.1%)
#   私域订单的日均水位:04-14~20 = 99.9 单,04-23~29 = 101.6 单 —— 前后没有任何真实变化。
#
# 正确答案:这是 UTC 日 / 北京日两套日界造成的**跨日错位**(语义层 caveats 第 4 条),
#   不是私域的真实波动。按同样的「日历日」对齐两套表做环比,必然出现假的暴涨与暴跌。
# 数值维不评:无根因切片(null-root)。
id: c3_timezone_shift
tier: L2
category: 数据质量
question: "私域 4 月 21 日订单 434 单(平时 100 单上下),4 月 22 日埋点会话 20,674(平时 4,500),这两天私域到底发生了什么?"
expected:
  root_cause_slice: null        # 「无法归因」类:正确答案是口径错位,没有根因切片
  mechanism: "同一批 340 单的跨夜专场在两张表上落在相邻的两天:业务订单取 UTC 日(04-21,
    434 单),埋点按北京时间落库(04-22,会话 20,674)—— 错位的是「日」不是「量」:
    两天合计两套表都只多了这 340 单(+154.6% / +156.1%),私域前后日均水位没变
    (99.9 → 101.6 单)"
  contribution_range: null      # 无根因切片 → 不评数值维
  required_depth: date_id       # 名义声明:根因切片为 null 时深度维跳过(视为通过)
  must_not_claim: ["私域在 04 月下旬出现了真实的流量暴增", "04-21 的订单激增是真实的经营变化",
                   "私域渠道在 04 月下旬迎来了促销高峰"]
distractors: ["单看 04-21 的订单表会得出「私域订单翻了两番」;单看 04-22 的埋点表会得出
             「私域流量涨到四倍」—— 两个结论都来自同一批 340 单",
             "orders.created_at 是 UTC 时间戳、touchpoints.date_id 是北京日:两张表的
             时间字段名相同(date_id)但口径不同"]
slice_occupancy:                # 全局量(无切片):跨两条事实表的口径错位,发生在相邻两天
  dimension: date
  keys: ["2026-04-21", "2026-04-22"]
  window: [2026-04-21, 2026-04-22]
overlap_with: [b4_budget_cap, c2_conv_overclaim, d3_correlation]
note: "例外声明(§5.10 约束 1):本 case 的观察对象是跨表的时间口径错位(全局量),窗口与
  b4(4 月起持续)、c2/d3(全区间)重叠,显式声明为「允许叠加」。错位只发生在
  orders 与 touchpoints 之间(ad_daily 与 orders 同为 UTC 日),所以它不影响 b 类漏斗坑。"
