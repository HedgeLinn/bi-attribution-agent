# d3 相关非因果:消耗与转化同涨,实为需求节律(「无法归因」类:L2,考控制变量)
#
# 数据锚点(AttributionEngine 实测;同周内的周末 vs 工作日,2 天对 2 天):
#   周末 2026-07-04~05 vs 工作日 2026-07-06~07(日均):
#     ad_cost     10,089,826 → 8,880,091 分(+13.62%)
#     ad_conv          1,140 →     1,017(+12.09%)
#     biz_orders       1,183 →     1,070(+10.61%)
#     biz_orders{is_paid: 自然}(**零消耗**)256 → 244(+4.92%,同一方向)
#     cvr           1.6970% → 1.7101%(×0.9924,**没变**)
#   —— 消耗与转化在同一条曲线上同涨同跌,但**转化率不动**:量级变化来自需求节律
#   (周内效应/季节趋势,造数里是 weekend ×1.10 + 需求线性 +10%),不是钱买来的能力。
#   更硬的旁证:零消耗的自然流量订单也从 3 月 6,931 涨到 8 月 7,505(+8.28%),
#   全站 3 月消耗 3,124,663 元 → 8 月 3,361,548 元(+7.58%)—— 两边只是同受时间驱动。
#
# 正确答案:任何跨时间窗的「消耗 vs 转化」回归都会得到强正相关(它们共享同一个需求因子),
#   但那不是因果关系:「加预算」不会改变转化率(周末 cvr 与工作日 cvr 差 0.76%)。
#   要回答「加预算有没有用」必须**控制时间变量**(同日/同周内比,或看零消耗的自然流量)。
# 数值维不评:无根因切片(null-root)。
id: d3_correlation
tier: L2
category: 归因陷阱
question: "从 3 月到 8 月消耗和转化都在涨,是不是说明多花预算就能带来更多转化?"
expected:
  root_cause_slice: null        # 「无法归因」类:没有根因切片,考的是一次因果判断
  mechanism: "消耗与转化的同向变化来自共同的需求节律:同周内周末 vs 工作日,消耗 +13.62%、
    平台转化 +12.09%、全量订单 +10.61%,连**零消耗**的自然流量订单也 +4.92%,而转化率
    完全没变(1.6970% → 1.7101%,×0.9924)—— 加预算能改变量级(曝光/点击/消耗),
    但改变不了转化率;把时间变量控制住,「多花钱 → 多转化」的关系就消失了"
  contribution_range: null      # 无根因切片 → 不评数值维
  required_depth: date_id       # 名义声明:根因切片为 null 时深度维跳过(视为通过)
  must_not_claim: ["加预算能提高转化率", "消耗增长是转化增长的原因",
                   "提升预算规模可以提升转化效率"]
distractors: ["跨月看消耗与转化的相关系数确实很高(共享需求因子,不是证据)",
             "全站 3 → 8 月消耗 +7.58%、转化 -12.4% 是 c1 的回传缺失造成的口径假象,
              不要拿它当反例(平台口径的绝对值在 8 月末已不可信)"]
slice_occupancy:                # 全局量(无切片):需求节律覆盖全区间
  dimension: date
  keys: ["2026-03-01", "2026-08-31"]
  window: [2026-03-01, 2026-08-31]
overlap_with: [b1_ctr_decay, b2_cpc_surge, b3_cvr_cliff, b4_budget_cap, b5_frequency_fatigue,
               b6_creative_rejected, c1_conv_backfill, c3_timezone_shift, c4_tracking_gap,
               c5_pause_gap, d1_promo_hangover, d2_brand_trap]
note: "例外声明(§5.10 约束 1):本 case 的观察对象是贯穿全区的需求节律(全局量),
  必然与所有 case 的时间窗重叠 —— 显式声明为「允许叠加」。它是**共同背景**而非局部异常:
  别的 case 的坑都叠在这条节律上,做任何跨窗比较前先把它控制掉(同周、等长、同期对照)。"
