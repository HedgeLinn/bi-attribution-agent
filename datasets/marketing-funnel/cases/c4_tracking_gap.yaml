# c4 埋点整段缺失(「无法归因」类:L2,考「没有行不是 0」)
#
# 数据锚点(AttributionEngine 实测):
#   CH_JD(京东快车)埋点会话 track_sessions:
#     2026-05-01~05-03 = 10,555  →  **2026-05-04~05-06 = None**  →  2026-05-07~05-09 = 9,477
#     query_metric('track_sessions', [], {channel_id: CH_JD}, 05-04, 05-06) 返回 **total = None**
#     —— SUM 语义下「没有行」是 NULL,不是 0(三张表都可能出现,看 caveats 第 3 条)
#   同期该渠道的投放与生意完全正常:
#     ad_cost  2,761,586 → 2,439,784 分(-11.65%)
#     ad_impr  568,006 → 488,824(-13.94%)
#     biz_orders 224 → 199(-11.16%)     ← COUNT 语义:没有行会得到 0,这里 199 说明订单是有的
#     降幅一致(≈ -12%):05-01~03 含两天周末(×1.10),缺口窗口全是工作日 —— 是周内节律,不是塌方
#   全站会话「下降」9.40%(160,717 → 145,604),而 CH_JD 之外的渠道合计只降 3.0%
#
# 正确答案:京东的埋点在 2026-05-04~05-06 整段**没有采到**(缺行),不是会话归零;
#   投放与订单两条旁证都正常。正确动作是排除这三天(或标注缺口),绝不能补零 ——
#   补零会把日均、占比、渠道结构全部算错。
# 数值维不评:无根因切片(null-root)。
id: c4_tracking_gap
tier: L2
category: 数据质量
question: "京东快车渠道 5 月 4 日到 6 日的埋点会话数不见了,是京东渠道没量了吗?"
expected:
  root_cause_slice: null        # 「无法归因」类:正确答案是埋点缺数,没有业务根因切片
  mechanism: "CH_JD 的埋点在 2026-05-04~05-06 整段没有行(聚合返回 None,SUM 语义下不是 0),
    而同期该渠道的平台消耗 -11.65%、曝光 -13.94%、业务订单 -11.16% 全部正常(降幅与
    周末/工作日节律一致)→ 是埋点在采集端缺了三天数据,不是京东渠道流量归零"
  contribution_range: null      # 无根因切片 → 不评数值维
  required_depth: date_id       # 名义声明:根因切片为 null 时深度维跳过(视为通过)
  must_not_claim: ["京东渠道 5 月初的会话量掉到了 0", "埋点缺口说明京东渠道流量真实萎缩",
                   "京东渠道 5 月初的投放停了"]
distractors: ["全站会话同期也「下降」9.40% —— 那正是这三天缺数造成的(其余渠道只降 3.0%)",
             "同一窗口的业务订单是 199(COUNT 语义给数),埋点会话是 None(SUM 语义给 NULL):
             两类指标在「没有行」时的表现不同,都要按缺失处理"]
slice_occupancy:                # 全局量(无切片):第三张事实表的采集完整性
  dimension: date
  keys: ["2026-05-04", "2026-05-06"]
  window: [2026-05-04, 2026-05-06]
overlap_with: [b4_budget_cap, c2_conv_overclaim, d3_correlation]
note: "例外声明(§5.10 约束 1):本 case 的观察对象是埋点侧(第三张事实表)的采集完整性,
  是全局量;窗口与 b4(4 月起持续)与 c2/d3(全区间)重叠,显式声明为「允许叠加」。
  注意与 c5 的区别:c5 的停投是**运营事实**(行本来就该没有),c4 是**采集缺陷**
  (行本该有却没有)—— 两者都考「没有行 ≠ 0」,但结论一个是切片、一个是无法归因。"
