# d1 大促脉冲消退(「无法归因」类:L2,考日历基线与天数口径)
#
# 数据锚点(AttributionEngine 实测;金额单位 = 元):
#   biz_gmv 等长 12 天窗口:2026-06-01~06-12 = 8,030,365  →  06-19~06-30 = 4,776,377
#     环比 -40.52% —— 但 618 大促(06-01~06-18,需求 ×1.6)刚结束,回落属预期
#   月内分段日均:06 月大促段(06-01~18)669,997 / 06 月尾段(06-19~30)398,031 /
#     07 月全月 422,077 / **05 月全月 425,180** —— 7 月回到了 5 月的大促前水位
#   整月对比:06 月 16,836,324 → 07 月 13,084,386(-22.28%);
#     而 05 月 13,180,574 → 07 月 13,084,386 只有 -0.73%(同为 31 天)
#   detect_anomaly 层面:6 月整月是 is_expected=True(618 在语义层日历里),
#     6 月下旬的 -40.52% 是脉冲消退,不是新的异常
#
# 正确答案:6 月下旬的下跌是大促脉冲消退的日历现象(语义层 calendar.promos 已声明
#   618 的区间与「自然回落属预期」的注记),7 月回到 5 月的水位即证;没有可归因的根因
#   切片 —— 把 -40.52% 报成经营事故、去翻渠道/商品,是典型的误报。
# 数值维不评:无根因切片(null-root)。
id: d1_promo_hangover
tier: L2
category: 归因陷阱
question: "6 月下旬的 GMV 比 6 月上旬掉了 40%,7 月也没恢复,是不是出问题了?"
expected:
  root_cause_slice: null        # 「无法归因」类:正确答案是日历现象,没有根因切片
  mechanism: "6 月下旬 GMV 环比上半月 -40.52%(等长 12 天窗口 8,030,365 → 4,776,377 元),
    是 618 大促(06-01~06-18,需求 ×1.6)脉冲结束后的正常回落:7 月日均 422,077 元
    已回到 5 月的大促前水位(425,180 元,-0.73%),而 06 月整月环比 -22.28% 完全由
    大促段贡献 —— 属预期,不是异常"
  contribution_range: null      # 无根因切片 → 不评数值维
  required_depth: date_id       # 名义声明:根因切片为 null 时深度维跳过(视为通过)
  must_not_claim: ["6 月下旬的 GMV 下滑是一次需要紧急干预的异常", "大促结束后的回落说明用户流失了",
                   "需要再上一轮促销来救 GMV"]
distractors: ["6 月下旬 vs 6 月上旬还混着天数口径(原始按 18 天 vs 12 天比会更陡),必须用等长窗口",
             "7 月同样有停投空白(c5)与季节趋势在动,但量级远小于脉冲消退"]
slice_occupancy:                # 全局量(无切片):整段 6 月下旬
  dimension: date
  keys: ["2026-06-19", "2026-06-30"]
  window: [2026-06-19, 2026-06-30]
overlap_with: [b1_ctr_decay, b4_budget_cap, c2_conv_overclaim, d3_correlation]
note: "例外声明(§5.10 约束 1):本 case 的观察对象是全局量,窗口与 b1(5 月底起持续)、
  b4(4 月起持续)、c2/d3(全区间)重叠,显式声明为「允许叠加」。618 干扰项本身也是全局的
  (它同时抬高 6 月的曝光、订单与 GMV),任何在 5~7 月取窗的 case 都要先扣掉它。"
