# c5 停投空白期(切片 > 计划:L2,考「缺失与零」;唯一的加法指标切片根因)
#
# 数据锚点(AttributionEngine 实测):
#   CAMP_JD_01(京快-类目词):
#     2026-07-05~07-18 **完全没有行**(ad_daily 与 orders 两张表都没有该计划的行)
#       ad_cost 窗口聚合 = None(SUM 语义:没有行 → NULL,不是 0)
#       biz_orders 窗口聚合 = 0(COUNT 语义:没有行 → 0)—— 同一个「没有行」两种表现
#     停投前 14 天(2026-06-21~07-04) vs 复投后 14 天(2026-07-19~08-01):
#       ad_cost   10,649,977 → 11,230,530 分(+5.45%),日均 760,713 → 802,181
#       biz_orders      595 →       629 单(+5.71%)
#     7 月整月 ad_cost = 13,537,618 vs 6 月 32,063,861(-57.78%)
#       按实际投放的 17 天算日均 = 796,330 分;按整月 31 天算(等价于把空白补零)= 436,697 分
#       —— 补零会把日均压低 45%,复投后又显得「暴涨」,两头都是口径错误。
#
# 正确答案:CAMP_JD_01 在 2026-07-05~07-18 停投(运营动作),消耗与订单的月度缺口几乎
#   全部来自这 14 天的空白;停投前后的日均与订单都持平(+5.45% / +5.71%,与全局需求
#   增长同量级),"效率腰斩" 是拿空白期当 0 算出来的假象。
# 数值维不评:消耗是加法指标,contribute('ad_cost','campaign','campaign_id') 确实能返回
#   数,但实测对窗口极敏感:6 月 → 7 月 得 CAMP_JD_01 = 0.1811(分母 -102,312,591 分
#   主要是 618 脉冲消退,不是它),换成「停投前后各 4 天」该计划根本进不了 top 榜
#   (全站变化只有 -559,828 分)。窗口敏感 → 声明任何区间都会误伤换窗口的诚实答案。
id: c5_pause_gap
tier: L2
category: 数据质量
question: "京快-类目词(CAMP_JD_01)7 月的消耗只有 6 月的 42%,是投放效率崩了吗?"
expected:
  root_cause_slice:
    dimension: campaign
    level: campaign_id
    key: CAMP_JD_01
    label: 京快-类目词
  mechanism: "CAMP_JD_01 在 2026-07-05~07-18 停投 14 天(两张表都**没有行**,不是取值为 0);
    排除这段空白后,停投前 14 天与复投后 14 天的消耗 10,649,977 → 11,230,530 分(+5.45%)、
    订单 595 → 629(+5.71%)完全持平 —— 7 月整月 -57.78% 是空白期造成的,
    不是效率下滑(补零算日均会从 796,330 压到 436,697 分)"
  contribution_range: null      # 见文件头:窗口敏感,声明区间会误伤换窗口的答案
  required_depth: campaign_id
  must_not_claim: ["该计划的投放效率腰斩", "7 月京快渠道的效率明显恶化",
                   "复投后日均消耗翻倍说明效率提升"]
distractors: ["7 月整月比 6 月少 57.78%,但 6 月含 618 大促(需求 ×1.6),分母本身就高",
             "复投后日均 802,181 分 > 停投前 760,713 分,那是需求增长 + 天数口径,不是效率提升"]
slice_occupancy:
  dimension: campaign
  keys: [CAMP_JD_01]
  window: [2026-07-05, 2026-07-18]
overlap_with: []
note: "判分边界(供审核者参考):停投是**运营事实**而非数据缺陷,所以本 case 的根因切片是
  CAMP_JD_01;若答案给出「无法归因 + 数据缺失」,定位维会判不通过 —— 这属于刻意设计
  (缺失 ≠ 无因),但也确实与 c4 的判分方向相反,是整套数据集里最需要人工复核的一条。"
