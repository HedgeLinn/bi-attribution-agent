# b2 人群包点击单价 +45%(L2:切片 > 人群包;漏斗坑)
#
# 数据锚点(AttributionEngine 实测):
#   AUD_XHS_02(小红书-美妆兴趣人群包,所属 CAMP_XHS_01,投放期 2026-04-22 ~ 2026-05-31)
#     cpc  2026-04-22~04-30 = 170.00 分  →  2026-05-15~05-31 = 246.49 分   +45.0%
#     cpa  同期 16,980.2 分 → 24,649.4 分(+45.2%,**与 cpc 同幅**)
#     cvr  同期 1.0012% → 1.0000%(-0.12%,**没动**)
#     ad_clicks 同期 72,916 → 146,000(点击量在涨,量没问题)
#   按投放天数:第 1~19 天 cpc = 170.00 分;第 20~31 天(2026-05-11 起)= 241.57 分
#     —— 成本拐点正好落在「上线第 20 天」,与日历日期无关。
#   同期对照 CAMP_XHS_02(同渠道、另一计划):cpc 100.00 → 100.00 分,
#     cvr 4.2034% → 4.2040%,cpa 2,379.1 → 2,378.6 分 —— 渠道整体单价没涨。
#
# 正确答案:成本上升是**买量单价**(竞价)被抬起来的,转化能力全程没变(trap:只看 cpa
# = cpc × (1/cvr),两个因子混在一个数里,只看 cpa 会误判成「转化变差」)。
# 数值维不评:cpc / cpa 都是比率指标,contribute 的 contribution 恒为 null。
#
# 干扰项(结构性):AUD_XHS_01 在该窗口**没有行** —— 人群包是「最晚开始者胜」的策略,
#   04-22 起 AUD_XHS_02 顶替了 AUD_XHS_01(CAMP_XHS_01 当期只有这一个人群包),
#   05-31 之后才回落。想拿 AUD_XHS_01 当同期对照,query_metric 会返回 null(不是 0);
#   正确的对照是**同渠道的另一个计划** CAMP_XHS_02。
id: b2_cpc_surge
tier: L2
category: 漏斗
question: "小红书-种草通投(CAMP_XHS_01)5 月下半月的转化成本比 4 月底高了 45%,问题出在哪?"
expected:
  root_cause_slice:
    dimension: audience
    level: audience_id
    key: AUD_XHS_02
    label: 小红书-美妆兴趣人群包
  mechanism: "人群包 AUD_XHS_02 自上线第 20 天(2026-05-11)起点击单价被抬升 45%
    (170.00 → 246.49 分),而点击量在涨、转化率全程未变(1.0012% → 1.0000%)——
    转化成本(CPA)与点击单价(CPC)同幅上涨,说明是买量竞价变贵,不是转化变差;
    同期同渠道另一计划 CAMP_XHS_02 单价与转化率都持平"
  contribution_range: null      # 比率指标(cpc / cpa)的贡献度恒为 null,见文件头
  required_depth: audience_id
  must_not_claim: ["该人群包的转化率下滑导致了成本上升", "小红书渠道整体获客成本上涨造成了本次变化",
                   "需要关停该人群包止损"]
distractors: ["AUD_XHS_01 在 04-22~05-31 没有任何行(被新人群包顶替),拿它当对照会得到 null",
             "CAMP_XHS_01 计划整体 cpc 同步上涨(该窗口里它 100% 的曝光就是这个人群包)"]
slice_occupancy:
  dimension: audience
  keys: [AUD_XHS_02]
  window: [2026-05-11, 2026-05-31]
overlap_with: []
note: "引擎行为:拆分必须停在 audience_id 层,且要拆到 cpc / cvr 两个因子上 ——
  decompose 已声明 cpc = 消耗 / 点击、cpa = 消耗 / 转化,沿这两条链各下钻一次即可看出
  分子涨、分母没变。人群包到期(2026-05-31)后 AUD_XHS_02 的行消失,之后 cpc 恢复正常水位,
  这段「消失」不是成本回落,是切片不在投。"
