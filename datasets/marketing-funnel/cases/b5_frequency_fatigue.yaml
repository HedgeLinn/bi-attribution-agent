# b5 频次抬高导致的 CTR 衰减(L2:切片 > 人群包;漏斗坑)
#
# 数据锚点(AttributionEngine 实测):
#   AUD_DY_02(抖音-高活人群包,所属 CAMP_DY_02,2026-08-11 起投放量放大)
#     ad_impr  2026-08-01~08-10 = 4,410,540  →  2026-08-15~08-24 = 7,890,430   +78.90%
#     ad_reach 同期 1,837,725 → 1,882,648(+2.44%,**触达没怎么变**)
#     frequency 同期 2.4000 → 4.1911(+74.63%)
#     ctr       同期 2.8280% → 1.6763%(-40.72%)
#     ad_clicks 同期 124,728 → 132,271(+6.05%,点击量还在涨 —— 所以这不是「素材没量了」)
#   对照 AUD_DY_01(同计划另一人群包,同期没有任何调整):
#     frequency 2.6000 → 2.6000,ctr 2.9707% → 3.0303% —— 完全持平。
#   该计划的素材 CR_TT_002 自 2026-03-01 起一直在投、从未更换(素材论不成立)。
#
# 正确答案:曝光被放大到同一批人身上(触达没变 → 频次从 2.4 涨到 4.19),同一批人反复
#   看到同一条素材,点击率自然衰减 —— 是**频次疲劳**,不是素材衰退(素材没有变),
#   也不是渠道问题。处方是收投放量 / 换人群包扩圈,不是换素材。
# 数值维不评:根因指标 frequency 与 ctr 都是比率指标,contribution 恒为 null。
#
# trap(§5.4):与 b1 的「素材按天数衰减」形态很像(都是 CTR 下降),区别在**同不同期**:
#   b1 是触达不变、素材自己在老;这里是触达不变、**曝光翻倍**在同一批人身上堆。
#   判据是 frequency(或 reach 与 impr 的比值),不是看 CTR 曲线本身。
id: b5_frequency_fatigue
tier: L2
category: 漏斗
question: "抖音-人群包精准B(CAMP_DY_02)8 月中旬的点击率掉了快一半,是素材老化了吗?"
expected:
  root_cause_slice:
    dimension: audience
    level: audience_id
    key: AUD_DY_02
    label: 抖音-高活人群包
  mechanism: "AUD_DY_02 自 2026-08-11 起被放大投放:曝光 +78.90% 而触达人数只 +2.44%,
    频次 2.40 → 4.19,同期点击率 2.8280% → 1.6763%(-40.72%);同计划对照人群包 AUD_DY_01
    频次与点击率完全持平,计划素材 CR_TT_002 自 2026-03-01 起未曾更换 —— 是同一批人被
    反复触达造成的频次疲劳,与素材新旧无关"
  contribution_range: null      # 比率指标(frequency / ctr)的贡献度恒为 null
  required_depth: audience_id
  must_not_claim: ["素材本身衰退造成了点击率下降", "应当更换素材来解决",
                   "应当继续加大该人群包的投放量"]
distractors: ["广告的点击量同期还在涨(+6.05%),所以不是「曝光变少了」",
             "8 月另一条线也有素材异常(b6 小红书素材被拒),两件事不要合并成「素材整体变差」"]
slice_occupancy:
  dimension: audience
  keys: [AUD_DY_02]
  window: [2026-08-11, 2026-08-31]
overlap_with: []
note: "引擎行为:必须拆到 frequency = 曝光 / 触达 这一层(语义层已声明该分解),
  并按 audience_id 下钻 —— 停在 campaign_id 看 CAMP_DY_02,只能看到一条被冲淡的下降曲线。
  与 b6 的影响集合不相交(不同维度、不同 key):b6 掐的是某个素材的曝光,这里抬的是某个
  人群包的频次,两者同时发生但互不解释。"
